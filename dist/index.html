<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Throughline Audit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: context rail + sticky topbar + scrolling work area. A working tool: dense, quiet, state-forward. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f4f6f8; --surface-3:#e9edf1;
  --border:#dde2e7; --border-strong:#c6ced6;
  --ink:#16202a; --ink-2:#55626d; --ink-3:#8b96a0;
  --primary:#0b6e63; --primary-ink:#08534a; --primary-bg:#def0ed;
  --good:#1a7f44; --good-bg:#def0e2;
  --warn:#9a5a06; --warn-bg:#f8ead0;
  --crit:#b3261e; --crit-bg:#f8dedb;
  --info:#1f52c4; --info-bg:#e0e8fb;
  --locked:#7b8690; --locked-bg:#e9edf1;
  --shadow:0 1px 2px rgba(20,32,42,.06),0 2px 8px rgba(20,32,42,.05);
  --radius:9px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1317; --surface:#151d23; --surface-2:#1a232a; --surface-3:#222d35;
  --border:#26323a; --border-strong:#364550;
  --ink:#e7edf1; --ink-2:#9aa6af; --ink-3:#687480;
  --primary:#36c9b8; --primary-ink:#8fe6db; --primary-bg:#123c38;
  --good:#45c874; --good-bg:#153522; --warn:#e0a53a; --warn-bg:#3a2e14;
  --crit:#f0756c; --crit-bg:#3c1d1a; --info:#7ea2f0; --info-bg:#1a2744;
  --locked:#7f8b95; --locked-bg:#222c34;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1317; --surface:#151d23; --surface-2:#1a232a; --surface-3:#222d35;
  --border:#26323a; --border-strong:#364550;
  --ink:#e7edf1; --ink-2:#9aa6af; --ink-3:#687480;
  --primary:#36c9b8; --primary-ink:#8fe6db; --primary-bg:#123c38;
  --good:#45c874; --good-bg:#153522; --warn:#e0a53a; --warn-bg:#3a2e14;
  --crit:#f0756c; --crit-bg:#3c1d1a; --info:#7ea2f0; --info-bg:#1a2744;
  --locked:#7f8b95; --locked-bg:#222c34;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono)} .tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:12px} .xs{font-size:11px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--primary);outline-offset:1px;border-radius:4px}

/* shell */
#app{height:100%}
.app{display:grid;grid-template-columns:252px 1fr;height:100%}
.rail{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:10px;padding:15px 16px 13px;border-bottom:1px solid var(--border)}
.logo{width:30px;height:30px;border-radius:8px;background:var(--primary);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px}
.brand-name{font-weight:700;letter-spacing:-.02em;font-size:15px;line-height:1.1}
.brand-sub{font-size:10px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.nav{padding:8px 10px;overflow-y:auto;flex:1;min-height:0}
.nav-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:12px 8px 5px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;color:var(--ink-2);padding:7px 9px;border-radius:7px;font-size:13.5px;font-weight:500;line-height:1.2}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--primary-bg);color:var(--primary-ink);font-weight:600}
.nav-item.locked{color:var(--ink-3)}
.nav-item svg{width:15px;height:15px;flex:none}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.sdot{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:9px;font-weight:700}
.sdot svg{width:10px;height:10px}
.sd-done{background:var(--good-bg);color:var(--good)} .sd-active{background:var(--warn-bg);color:var(--warn)} .sd-locked{background:var(--locked-bg);color:var(--locked)} .sd-open{background:var(--surface-3);color:var(--ink-3)}
.eng-head{padding:10px 8px 4px}
.eng-head .en{font-weight:600;font-size:13.5px;line-height:1.25}
.eng-head .ec{font-size:11.5px;color:var(--ink-3)}
.rail-foot{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.who{font-size:12px;line-height:1.25;min-width:0;text-align:left;border:0;background:none;padding:0;flex:1}
.who b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{color:var(--ink-3);font-size:11px}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:7px;width:30px;height:30px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--border-strong)}
.icon-btn svg{width:15px;height:15px}
.icon-btn.sm{width:26px;height:26px;border-radius:6px}
.main{min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:10px max(18px,env(safe-area-inset-right,0px)) 10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:51px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.topbar .sp{flex:1}
.content{padding:20px max(20px,env(safe-area-inset-right,0px)) 80px max(20px,env(safe-area-inset-left,0px));max-width:1240px;width:100%}
.page-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:21px}
.page-head .sub{color:var(--ink-2);font-size:13px;margin-top:3px}
.page-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;line-height:1.1;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary-ink)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06211d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#06211d}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--border))}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn:disabled:hover{border-color:var(--border-strong);color:inherit}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:7px;padding:6px 9px;line-height:1.35;min-width:0}
textarea.inp{resize:vertical;min-height:58px}
.inp:disabled{background:var(--surface-2);color:var(--ink-2)}
.inp.cell{border-color:transparent;background:transparent;padding:4px 6px;border-radius:5px}
.inp.cell:hover{border-color:var(--border)}
.inp.cell:focus{border-color:var(--primary);background:var(--surface)}
.inp.bad{border-color:var(--crit)}
label.fld{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
label.fld .hint{font-weight:400;color:var(--ink-3)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--ink)}
.chk input{width:15px;height:15px;accent-color:var(--primary)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.5;white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.c-good{background:var(--good-bg);color:var(--good)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-crit{background:var(--crit-bg);color:var(--crit)}
.c-info{background:var(--info-bg);color:var(--info)} .c-lock{background:var(--locked-bg);color:var(--locked)} .c-prim{background:var(--primary-bg);color:var(--primary-ink)} .c-mut{background:var(--surface-3);color:var(--ink-2)}
.tag{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);padding:1px 6px;border-radius:5px;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:15px 17px}
.stack{display:grid;gap:14px;min-width:0}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.h-sec{display:flex;align-items:center;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.h-sec h2{font-size:14.5px}
.h-sec .hint{font-size:12px;color:var(--ink-3)}
.h-sec .line{flex:1;height:1px;background:var(--border);min-width:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.stat .lbl{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.stat .val{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .val small{font-size:12.5px;color:var(--ink-3);font-weight:500}
.stat .sub{font-size:11.5px;color:var(--ink-2)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
td.tight{padding:4px 5px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.flag td{background:color-mix(in srgb,var(--crit-bg) 55%,transparent)}

/* banners & guards */
.banner{display:flex;gap:10px;padding:11px 13px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-2);font-size:12.5px;align-items:flex-start}
.banner svg{width:16px;height:16px;flex:none;margin-top:2px}
.banner.lock{background:var(--locked-bg);color:var(--ink-2);border-style:dashed;border-color:var(--border-strong)}
.banner.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--ink)}
.banner.warn svg{color:var(--warn)}
.banner.crit{background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.banner.crit svg{color:var(--crit)}
.banner.good{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.banner.good svg{color:var(--good)}
.banner b{font-weight:600}
.guard-list{margin:5px 0 0;padding-left:17px}
.guard-list li{margin:2px 0}

/* split layout */
.split{display:grid;grid-template-columns:264px 1fr;gap:16px;align-items:start}
.list{display:grid;gap:2px;padding:6px}
.list-item{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;text-align:left;border:0;background:none;padding:8px 9px;border-radius:7px;font-size:12.5px;width:100%}
.list-item:hover{background:var(--surface-2)}
.list-item.active{background:var(--primary-bg)}
.list-item .lt{font-weight:600;line-height:1.25;min-width:0}
.list-item .ls{font-size:11px;color:var(--ink-3);font-weight:400}
.sticky{position:sticky;top:66px}

/* engagement cards */
.eng{display:grid;grid-template-columns:1fr auto;gap:14px;padding:14px 16px;align-items:center}
.eng h3{font-size:15px}
.eng .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;color:var(--ink-2);font-size:12px}
.eng .meta b{color:var(--ink);font-weight:600}
.pipe{display:flex;gap:3px;margin-top:10px;max-width:520px}
.pipe i{height:5px;flex:1;border-radius:3px;background:var(--surface-3)}
.pipe i.done{background:var(--primary)} .pipe i.active{background:var(--warn)}

/* stage overview */
.stage{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:10px 12px;border:0;background:none;border-radius:8px;text-align:left;width:100%}
.stage:hover{background:var(--surface-2)}
.stage .node{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px}
.stage .node svg{width:15px;height:15px}
.stage .sn{font-weight:600;font-size:13.5px}
.stage .sr{font-size:12px;color:var(--ink-2);margin-top:1px}

/* dropzone */
.dropzone{border:2px dashed var(--border-strong);border-radius:var(--radius);background:var(--surface-2);padding:20px;text-align:center}
.dropzone.hot{border-color:var(--primary);background:var(--primary-bg)}
.dropzone h4{font-size:14px}
.dropzone p{font-size:12.5px;color:var(--ink-2);margin:4px 0 12px}

/* risk */
.score{display:inline-grid;place-items:center;min-width:34px;height:24px;padding:0 7px;border-radius:6px;font-weight:700;font-family:var(--mono);font-size:12px;color:#fff}
.t-1{background:#1a7f44}.t-2{background:#5f8a17}.t-3{background:#b06a10}.t-4{background:#b3261e}.t-5{background:#7d1612}
.heat{display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px;font-size:11px;max-width:420px}
.heat .hc{aspect-ratio:1.6;border-radius:5px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px}
.heat .ax{display:grid;place-items:center;color:var(--ink-3);font-weight:600;padding:0 4px}
.risk-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.risk-head{padding:12px 14px;display:grid;gap:10px}
.ctl{border-top:1px solid var(--border);padding:12px 14px;background:var(--surface-2);display:grid;gap:10px}
.ctl:last-child{border-radius:0 0 var(--radius) var(--radius)}
.attr-row{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center}
.proposal{border:1px dashed var(--border-strong);border-radius:8px;padding:10px 12px;background:var(--surface);display:grid;gap:6px}

/* testing grid */
.tri{width:30px;height:26px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);font-weight:700;font-size:13px;display:inline-grid;place-items:center;line-height:1}
.tri.p{background:var(--good-bg);color:var(--good);border-color:transparent}
.tri.f{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.tri.n{background:var(--surface-3);color:var(--ink-3);border-color:transparent;font-size:10px}
.concl{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-2)}
.concl .big{font-size:14.5px;font-weight:700}
.concl.eff{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.concl.ineff{background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.factor{display:grid;grid-template-columns:24px 1fr;gap:9px;align-items:start}
.factor .fn{width:24px;height:24px;border-radius:6px;background:var(--primary-bg);color:var(--primary-ink);display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:18px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 14px;font-size:12.5px;margin:0}
.kv dt{color:var(--ink-3);font-weight:600}.kv dd{margin:0}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;color:var(--ink-2);padding:8px 12px;font-size:13px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--primary-ink);border-bottom-color:var(--primary)}

/* report */
.report{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.report .cover{padding:26px 30px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.report .cover .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--primary-ink);font-weight:700}
.report .cover h2{font-size:20px;margin:6px 0 4px}
.report .body{padding:22px 30px;display:grid;gap:20px}
.report h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:8px}
.report .dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px}
.report .dash div{border:1px solid var(--border);border-radius:8px;padding:9px 11px;text-align:center}
.report .dash b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.report .dash div:first-child b{font-size:14px;line-height:1.3;padding:3px 0;overflow-wrap:anywhere}
.report .dash span{font-size:10.5px;color:var(--ink-3)}
.obs{border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:10px}
.obs .oh{display:flex;gap:9px;align-items:center;padding:9px 13px;background:var(--surface-2);flex-wrap:wrap}
.obs .oh h4{font-size:13.5px}
.obs dl{margin:0;padding:11px 14px;display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:12.5px}
.obs dt{color:var(--ink-3);font-weight:600}.obs dd{margin:0;white-space:pre-wrap}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,100%);max-height:88vh;overflow:auto}
.modal .mh{padding:15px 18px 0;font-size:15px;font-weight:600}
.modal .mb{padding:12px 18px;display:grid;gap:12px;font-size:13px}
.modal .mf{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px}
.toast{background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:9px;font-size:12.5px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:340px}
.empty{padding:34px 20px;text-align:center;color:var(--ink-2)}
.empty h3{font-size:15px;color:var(--ink);margin-bottom:5px}
.bar{height:7px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:5px}

.menu-btn{display:none}
.scrim{display:none}
@media (max-width:980px){.split{grid-template-columns:1fr}.sticky{position:static}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:262px;z-index:40;transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  sampleSize(ctl, pop, meth) {

    const n = Number(pop) || 0;

      const r = meth.sample.find(x => x.freq === eq);

    }

  plannedSize(eng, ctl, meth) {

  /* One attribute failure on one item makes the control ineffective. There is no other route. */

  parseCSV(text) {

    const m = n.match(/(20\d\d)[-_ .]?(0[1-9]|1[0-2])(?!\d)/) || n.match(/(0[1-9]|1[0-2])[-_ .](20\d\d)/);
    const period = m ? (m[1].length === 4 ? `${m[1]}-${m[2]}` : `${m[2]}-${m[1]}`) : (n.match(/20\d\d/) || [''])[0];
    return { docType: best.t, conf: Math.min(0.99, Math.round(best.score * 100) / 100), period };
  },
  fieldMatch(field, headers) { const f = Engine.norm(field); return headers.some(h => h === f || (f.length > 3 && (h.includes(f) || f.includes(h)) && h.length > 3)); },
  missingFields: (fields, headers) => (fields || []).filter(f => !Engine.fieldMatch(f, headers || [])),
  suggestRequest(doc, requests) {
    let best = { id: '', score: 0 };
    const words = s => String(s).toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 3);
    const dw = new Set(words(doc.name + ' ' + doc.docType));
    requests.forEach(q => {
      let s = 0;
      if (q.fields.length && doc.headers && doc.headers.length) s += 0.75 * (q.fields.length - Engine.missingFields(q.fields, doc.headers).length) / q.fields.length;
      const qw = words(q.item); const hit = qw.filter(w => dw.has(w) || [...dw].some(d => d.startsWith(w.slice(0, 5)))).length;
      if (qw.length) s += 0.45 * hit / qw.length;
      if (q.fields.length && !(doc.headers && doc.headers.length)) s *= 0.6;
      if (s > best.score) best = { id: q.id, score: s };
    });
    return { id: best.id, conf: Math.min(0.99, Math.round(best.score * 100) / 100) };
  },
  async hash(buf) {
    try { const d = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join(''); }
    catch (e) { let h = 2166136261; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i++) { h ^= u[i]; h = Math.imul(h, 16777619); } return 'fnv-' + (h >>> 0).toString(16); }
  },

  /* ---------- analysis ---------- */
  num: v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; },
  key: (row, keys) => keys.map(k => String(row[k] ?? '').trim().toUpperCase()).join(' | '),
  reconcile(sources, tol) {
    const maps = sources.map(s => { const m = new Map(); s.rows.forEach(r => { const k = Engine.key(r, s.keys); const e = m.get(k) || { sum: 0, n: 0 }; e.sum += Engine.num(r[s.amount]); e.n++; m.set(k, e); }); return m; });
    const all = new Set(); maps.forEach(m => m.forEach((v, k) => all.add(k)));
    const res = { matched: 0, exceptions: [], missing: [], total: all.size, diffTotal: 0 };
    all.forEach(k => {
      const vals = maps.map(m => m.get(k));
      if (vals.some(v => !v)) { res.missing.push({ key: k, vals: vals.map(v => v ? v.sum : null) }); return; }
      const nums = vals.map(v => Math.round(v.sum * 100) / 100), d = Math.round((Math.max(...nums) - Math.min(...nums)) * 100) / 100;
      if (d > tol) { res.exceptions.push({ key: k, vals: nums, diff: Math.round((nums[nums.length - 1] - nums[0]) * 100) / 100 }); res.diffTotal += Math.abs(nums[nums.length - 1] - nums[0]); }
      else res.matched++;
    });
    res.diffTotal = Math.round(res.diffTotal * 100) / 100;
    res.exceptions.sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
    return res;
  },
  duplicates(rows, cols) {
    const m = new Map();
    rows.forEach((r, i) => { const k = Engine.key(r, cols); if (!k.replace(/[ |]/g, '')) return; (m.get(k) || m.set(k, []).get(k)).push(i + 2); });
    return [...m.entries()].filter(e => e[1].length > 1).map(e => ({ key: e[0], count: e[1].length, lines: e[1] })).sort((a, b) => b.count - a.count);
  },
  nearThreshold(rows, col, thr, pct) {
    const lo = thr * (1 - pct / 100);
    return rows.map((r, i) => ({ line: i + 2, v: Engine.num(r[col]), row: r })).filter(x => x.v >= lo && x.v < thr);
  },
  rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
  pick(n, k, seed) { const r = Engine.rng(seed), idx = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx.slice(0, Math.min(k, n)).sort((a, b) => a - b); },

  /* ---------- quality: the file scored against explicit rules ---------- */
  quality(eng) {
    const cfg = Engine.typeCfg(eng.scope.type), out = [];
    const rule = (name, stage, applicable, bad) => { if (applicable) out.push({ name, stage, ok: !bad.length, items: bad }); };
    rule('Scope names its exclusions', 'scope', true, (eng.scope.exclusions.length || eng.scope.noExclusions) ? [] : ['No exclusions recorded']);
    rule('Received requests have a document tied to them', 'requests', eng.requests.length > 0, eng.requests.filter(q => q.status === 'received' && !eng.docs.some(d => d.requestId === q.id)).map(q => q.item));
    rule('Every document records its source strength', 'requests', eng.docs.length > 0, eng.docs.filter(d => !d.strength).map(d => d.name));
    rule('Every in-scope sub-process is understood and confirmed', 'understanding', !!eng.cp1, Engine.guards.understanding(eng));
    rule('Process steps name a role and an evidence trail', 'understanding', eng.steps.length > 0, eng.steps.filter(s => !s.actor.trim() || !s.evidence.trim()).map(s => `${KB.sub(s.sub).name} step ${s.n}`));
    rule('Every risk has a distinct root cause, an impact and an owner', 'risks', eng.risks.length > 0, eng.risks.filter(r => !r.cause || !String(r.impact).trim() || !String(r.owner).trim() || Engine.norm(r.cause) === Engine.norm(r.desc)).map(r => r.id));
    rule('Every risk is rated', 'risks', eng.risks.length > 0, eng.risks.filter(r => !r.L || !r.I).map(r => r.id));
    const live = eng.controls.filter(c => !c.absent);
    rule('Every control has an owner, a frequency and test attributes', 'risks', cfg.controls && live.length > 0, live.filter(c => !c.owner.trim() || !c.freq || !c.attrs.filter(a => a.trim()).length).map(c => c.id));
    const concluded = live.filter(c => (eng.dtests[c.id] || {}).conclusion);
    rule('Design conclusions rest on a dated walkthrough', 'testing', concluded.length > 0, concluded.filter(c => { const d = eng.dtests[c.id]; return !String(d.walkthrough || '').trim() || !d.date; }).map(c => c.id));
    const seen = {}; concluded.forEach(c => (eng.dtests[c.id].factors || []).forEach(f => { const k = Engine.norm(f); if (k.length > 12) (seen[k] = seen[k] || new Set()).add(c.id); }));
    const boiler = new Set(); Object.values(seen).forEach(s => { if (s.size >= 3) s.forEach(id => boiler.add(id)); });
    rule('Design factors are specific, not the same sentences on every control', 'testing', concluded.length >= 3, [...boiler]);
    const tested = live.filter(c => ((eng.etests[c.id] || {}).items || []).length);
    rule('Every effectiveness test states its population and completeness basis', 'testing', tested.length > 0, tested.filter(c => { const t = eng.etests[c.id]; return !t.popCount || !t.completeness || (t.completeness === 'reconciled' && !String(t.completenessBasis || '').trim()); }).map(c => c.id));
    const wps = []; concluded.forEach(c => wps.push([c.id + ' design', eng.dtests[c.id]])); tested.forEach(c => wps.push([c.id + ' effectiveness', eng.etests[c.id]]));
    rule('Working papers are reviewed by someone other than the preparer', 'testing', wps.length > 0, wps.filter(w => !w[1].reviewer || w[1].reviewer === w[1].preparer).map(w => w[0]));
    rule('Gaps carry root cause, rating, owner and date', 'gaps', eng.gaps.length > 0, eng.gaps.filter(g => Engine.gapMissing(g).length).map(g => g.id));
    const today = Engine.today(), badDates = [];
    concluded.forEach(c => { const d = eng.dtests[c.id]; if (d.date && (d.date > today || (eng.cp1 && d.date < eng.cp1.at.slice(0, 10)))) badDates.push(`${c.id}: walkthrough dated ${d.date}`); });
    eng.gaps.forEach(g => { if (g.due && g.createdAt && g.due < g.createdAt.slice(0, 10)) badDates.push(`${g.id}: target date precedes the finding`); });
    rule('Dates are possible', 'overview', concluded.length + eng.gaps.length > 0, badDates);
    const pass = out.filter(x => x.ok).length;
    return { score: out.length ? Math.round(100 * pass / out.length) : null, rules: out };
  },

  proposeOverall(eng, meth) {
    const high = eng.gaps.filter(g => g.rating === 'High').length, mod = eng.gaps.filter(g => g.rating === 'Moderate').length;
    const o = meth.overall;
    if (high >= 2) return { v: o[2], why: `${high} high-rated gaps` };
    if (high === 1 || mod >= 2) return { v: o[1], why: high ? '1 high-rated gap' : `${mod} moderate gaps` };
    return { v: o[0], why: eng.gaps.length ? 'no high-rated gaps' : 'no gaps raised' };
  },
};

/* State, persistence and the operations that change an engagement. Every operation writes the audit trail. */
const STORE_KEY = 'throughline.v1';
let S = null;

const Store = {
  fresh() {
    return { v: 1, users: [{ id: 'u1', name: 'A. Rahman', role: 'Engagement lead' }, { id: 'u2', name: 'S. Haddad', role: 'Senior auditor' }], userId: 'u1',
      meth: JSON.parse(JSON.stringify(DEFAULT_METH)), engs: [], ui: { view: 'home', engId: '', stage: 'overview' } };
  },
  load() {
    try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const s = JSON.parse(raw); if (s && s.v === 1) { S = s; S.ui = Object.assign({ view: 'home', engId: '', stage: 'overview' }, S.ui || {}); S.ui.modal = null; return false; } } } catch (e) {}
    S = Store.fresh(); return true;
  },
  save() {
    const ui = { view: S.ui.view, engId: S.ui.engId, stage: S.ui.stage, sub: S.ui.sub, ctl: S.ui.ctl };
    const snap = Object.assign({}, S, { ui });
    try { localStorage.setItem(STORE_KEY, JSON.stringify(snap)); Store.memOnly = false; }
    catch (e) {
      try { const slim = JSON.parse(JSON.stringify(snap)); slim.engs.forEach(en => en.docs.forEach(d => { if (d.rows && d.rows.length > 400) { d.rowsDropped = d.rows.length; d.rows = d.rows.slice(0, 400); } })); localStorage.setItem(STORE_KEY, JSON.stringify(slim)); } catch (e2) {}
      Store.memOnly = true;
    }
  },
  reset() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} S = Store.fresh(); },
};
const me = () => S.users.find(u => u.id === S.userId) || S.users[0];
const E = () => S.engs.find(e => e.id === S.ui.engId);
const subName = id => (KB.sub(id) || { name: id }).name;

const Ops = {
  id(eng, p) { eng.seq[p] = (eng.seq[p] || 0) + 1; return p + '-' + String(eng.seq[p]).padStart(2, '0'); },
  log(eng, a, d) { eng.trail.push({ t: new Date().toISOString(), u: me().name, a, d: d || '' }); },

  newEngagement() {
    const eng = { id: 'E-' + Date.now().toString(36).toUpperCase().slice(-5), sample: false, createdAt: new Date().toISOString(), seq: {},
      scope: { client: '', name: '', type: 'full', objective: '', periodFrom: '', periodTo: '', entities: '', framework: 'coso2013', standard: 'gias2024', reader: '', processes: [], exclusions: [], noExclusions: false },
      cp1: null, cp2: null, itgc: { status: 'pending', note: '' }, requests: [], docs: [], subs: {}, steps: [], risks: [], dismissed: [], controls: [],
      dtests: {}, etests: {}, analyses: [], gaps: [], topical: [], report: { overall: '', summary: '', limitations: '', issuedAt: '', issuedBy: '' }, followup: {}, trail: [] };
    S.engs.unshift(eng); Ops.log(eng, 'Engagement created');
    return eng;
  },

  /* ----- scope (Checkpoint 1) ----- */
  confirmScope(eng) {
    if (Engine.guards.cp1(eng).length) return false;
    eng.cp1 = { by: me().name, at: new Date().toISOString() };
    Ops.deriveRequests(eng);
    eng.scope.processes.forEach(id => { eng.subs[id] = eng.subs[id] || { noProcedure: false, confirmedBy: '', confirmedAt: '', walkthrough: '' }; });
    const itIn = eng.scope.processes.some(id => KB.sub(id).process === 'itgc');
    if (itIn && !eng.topical.length) eng.topical = KB.topical.cyber.items.map(i => ({ id: i.id, status: '', note: '' }));
    if (!itIn) eng.topical = [];
    Ops.log(eng, 'Checkpoint 1 — scope confirmed', `${eng.scope.processes.length} sub-processes in scope · ${eng.requests.length} requests derived`);
    return true;
  },
  reopenScope(eng, reason) { eng.cp1 = null; Ops.log(eng, 'Scope reopened', reason); },
  deriveRequests(eng) {
    const due = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
    eng.scope.processes.forEach(sid => KB.sub(sid).requests.forEach(q => {
      if (eng.requests.some(x => x.item === q.item)) return;
      eng.requests.push({ id: Ops.id(eng, 'Q'), item: q.item, form: q.form, fields: q.fields.slice(), feeds: q.feeds, sub: sid, owner: '', due, status: 'pending', naReason: '', missing: [], derived: true });
    }));
  },

  /* ----- documents ----- */
  async ingest(eng, name, size, mime, text, buf) {
    const doc = { id: Ops.id(eng, 'D'), name, size, mime: mime || '', uploadedAt: new Date().toISOString(), by: me().name, headers: [], rows: null, strength: '', requestId: '', tieConf: 0 };
    if (text != null) { const p = Engine.parseCSV(text); if (p.headers.length > 1 && p.rows.length) { doc.headers = p.headers; doc.rows = p.rows; } }
    Object.assign(doc, Engine.classify(name, doc.headers));
    doc.hash = buf ? await Engine.hash(buf) : '';
    const sug = Engine.suggestRequest(doc, eng.requests.filter(q => q.status !== 'na'));
    doc.tieConf = sug.conf;
    eng.docs.push(doc);
    Ops.log(eng, 'Document received', `${name} · classified as ${doc.docType} (${Math.round(doc.conf * 100)}%)`);
    if (sug.id && sug.conf >= 0.5) Ops.tie(eng, doc, sug.id, true);
    return doc;
  },
  tie(eng, doc, requestId, auto) {
    const prev = doc.requestId; doc.requestId = requestId || '';
    if (!auto) doc.tieConf = 1;
    [prev, requestId].filter(Boolean).forEach(id => Ops.refreshRequest(eng, eng.requests.find(q => q.id === id)));
    if (requestId) Ops.log(eng, auto ? 'Document tied automatically' : 'Document tied', `${doc.name} → ${(eng.requests.find(q => q.id === requestId) || {}).item}`);
  },
  refreshRequest(eng, q) {
    if (!q || q.status === 'na') return;
    const docs = eng.docs.filter(d => d.requestId === q.id);
    if (!docs.length) { q.status = 'pending'; q.missing = []; return; }
    const tabular = docs.filter(d => d.rows);
    if (q.fields.length && tabular.length) { q.missing = tabular.map(d => Engine.missingFields(q.fields, d.headers)).sort((a, b) => a.length - b.length)[0]; q.status = q.missing.length ? 'incomplete' : 'received'; }
    else if (q.fields.length) { q.missing = ['not in the required tabular form']; q.status = 'incomplete'; }
    else { q.missing = []; q.status = 'received'; }
  },
  removeDoc(eng, id) { const d = eng.docs.find(x => x.id === id); if (!d) return; eng.docs = eng.docs.filter(x => x.id !== id); Ops.refreshRequest(eng, eng.requests.find(q => q.id === d.requestId)); Ops.log(eng, 'Document removed', d.name); },

  /* ----- understanding ----- */
  addStep(eng, sub, init) {
    const n = eng.steps.filter(s => s.sub === sub).length + 1;
    const st = Object.assign({ id: Ops.id(eng, 'S'), sub, n, actor: '', action: '', system: '', review: '', approval: '', evidence: '' }, init || {});
    eng.steps.push(st); return st;
  },
  renumber(eng, sub) { eng.steps.filter(s => s.sub === sub).sort((a, b) => a.n - b.n).forEach((s, i) => { s.n = i + 1; }); },
  stepFlags(s) {
    const f = [], a = Engine.norm(s.actor);
    if (!s.review.trim() && !s.approval.trim()) f.push('No reviewer or approver');
    if (a && (a === Engine.norm(s.approval) || a === Engine.norm(s.review))) f.push('Same role performs and checks');
    if (!s.evidence.trim()) f.push('No evidence retained');
    return f;
  },

  /* ----- risks & controls ----- */
  acceptLib(eng, sub, libId) {
    const L = KB.libRisk(libId); if (!L) return null;
    const r = { id: Ops.id(eng, 'R'), sub, stepId: '', title: L.title, desc: L.desc, cause: L.cause, impact: L.impact || '', cat: L.cat, fraud: !!L.fraud, owner: '', L: 0, I: 0, source: 'library', libId, principle: L.principle, assertion: L.assertion };
    eng.risks.push(r); Ops.log(eng, 'Risk accepted from library', `${r.id} ${r.title} (${libId})`); return r;
  },
  addRisk(eng, sub, init) {
    const r = Object.assign({ id: Ops.id(eng, 'R'), sub, stepId: '', title: '', desc: '', cause: '', impact: '', cat: 'Operational', fraud: false, owner: '', L: 0, I: 0, source: 'manual', libId: '', principle: 10, assertion: '' }, init || {});
    eng.risks.push(r); Ops.log(eng, 'Risk added', r.id); return r;
  },
  removeRisk(eng, id) {
    eng.controls.filter(c => c.riskId === id).forEach(c => Ops.removeControl(eng, c.id, true));
    eng.risks = eng.risks.filter(r => r.id !== id); Ops.log(eng, 'Risk removed', id);
  },
  addControl(eng, riskId, fromLib) {
    const r = eng.risks.find(x => x.id === riskId), L = fromLib && r.libId ? (KB.libRisk(r.libId) || {}).ctl : null;
    const c = { id: Ops.id(eng, 'C'), riskId, absent: false, desc: L ? L.desc : '', owner: L ? L.owner : '', nature: L ? L.nature : 'Preventive', type: L ? L.type : 'Manual',
      freq: L ? L.freq : '', key: true, itDep: L ? !!L.itDep : false, principle: r.principle, assertion: r.assertion, attrs: L ? L.attrs.slice() : [''], planSize: 0, planReason: '', fromLib: !!L };

  },
  recordAbsence(eng, riskId) {
    const r = eng.risks.find(x => x.id === riskId);
    const c = { id: Ops.id(eng, 'C'), riskId, absent: true, desc: 'None — no control exists for this risk.', owner: '', nature: '', type: '', freq: '', key: false, itDep: false, principle: r.principle, assertion: r.assertion, attrs: [], planSize: 0, planReason: '' };
    eng.controls.push(c);
    Ops.ensureGap(eng, 'absence:' + c.id, { controlId: c.id, title: `No control over: ${r.title}`, desc: `No control exists to address the risk that ${lower1(r.desc)} The inherent rating stands as the residual rating.`, cause: r.cause, criterion: criterionFor(r) });
    Ops.log(eng, 'Absence recorded', `${c.id}: no control exists for ${riskId}`); return c;
  },
  removeControl(eng, id, quiet) {
    eng.controls = eng.controls.filter(c => c.id !== id); delete eng.dtests[id]; delete eng.etests[id];
    ['absence:', 'design:', 'toe:'].forEach(p => Ops.dropGap(eng, p + id));
    if (!quiet) Ops.log(eng, 'Control removed', id);
  },
  blankD: o => Object.assign({ plan: '', walkthrough: '', date: '', docIds: [], factors: ['', '', '', '', ''], conclusion: '', failReason: '', preparer: '', reviewer: '', reviewedAt: '' }, o || {}),
  blankE: o => Object.assign({ popCount: 0, popSource: '', datasetId: '', completeness: '', completenessBasis: '', seed: 0, items: [], preparer: '', reviewer: '', reviewedAt: '' }, o || {}),
  dt(eng, cid) { return eng.dtests[cid] || (eng.dtests[cid] = Ops.blankD()); },
  et(eng, cid) { return eng.etests[cid] || (eng.etests[cid] = Ops.blankE()); },

  /* ----- plan (Checkpoint 2) ----- */
  approvePlan(eng) { if (Engine.guards.cp2(eng).length) return false; eng.cp2 = { by: me().name, at: new Date().toISOString() }; Ops.log(eng, 'Checkpoint 2 — procedure plan approved', `${eng.controls.filter(c => !c.absent).length} controls to test`); return true; },
  reopenPlan(eng, reason) { eng.cp2 = null; Ops.log(eng, 'Procedure plan reopened', reason); },

  /* ----- testing ----- */
  designBlockers(eng, c) {
    const d = Ops.dt(eng, c.id), r = [];
    if (!String(d.walkthrough).trim()) r.push('Walkthrough narrative is empty');
    if (!d.date) r.push('Walkthrough date is missing');
    if (d.factors.some(f => !String(f).trim())) r.push('All five design factors need an answer (state "not applicable" with the reason where it is)');
    if (c.itDep && Engine.itgc(eng).status === 'failed') r.push('IT general controls have failed — this control depends on them and fails by design');
    return r;
  },
  concludeDesign(eng, c, result, reason) {
    const d = Ops.dt(eng, c.id); d.conclusion = result; d.failReason = result === 'fail' ? reason : ''; d.preparer = me().name; d.reviewer = ''; d.reviewedAt = '';
    const r = eng.risks.find(x => x.id === c.riskId);
    if (result === 'fail') Ops.ensureGap(eng, 'design:' + c.id, { controlId: c.id, title: `Design of ${c.id} does not address the risk`, desc: `The control as described would not prevent or detect the risk. ${reason}`, cause: r.cause, criterion: criterionFor(r) });
    else Ops.dropGap(eng, 'design:' + c.id);
    Ops.log(eng, `Test of design concluded — ${result.toUpperCase()}`, `${c.id}${reason ? ': ' + reason : ''}`);
  },
  resetDesign(eng, c, reason) { const d = Ops.dt(eng, c.id); d.conclusion = ''; d.reviewer = ''; Ops.dropGap(eng, 'design:' + c.id); Ops.log(eng, 'Design conclusion withdrawn', `${c.id}: ${reason}`); },
  selectSample(eng, c) {
    const t = Ops.et(eng, c.id), plan = Engine.plannedSize(eng, c, S.meth);
    if (!t.popCount || !plan.size) return false;
    t.seed = Math.floor(Math.random() * 1e9); t.preparer = me().name;
    const ds = eng.docs.find(d => d.id === t.datasetId && d.rows);
    const idx = Engine.pick(ds ? ds.rows.length : t.popCount, plan.size, t.seed);
    t.items = idx.map(i => ({ ref: ds ? Ops.rowRef(ds, i) : `Item ${i + 1} of ${t.popCount}`, line: i + 1, res: [], note: '', evidence: '', explanation: '', corroborated: false, accepted: false, ext: false }));
    Ops.log(eng, 'Sample selected', `${c.id}: ${t.items.length} of ${t.popCount} · ${plan.basis} · seed ${t.seed}`); return true;
  },
  rowRef(ds, i) { const r = ds.rows[i]; return ds.headers.slice(0, 3).map(h => r[h]).filter(Boolean).join(' · ') || `Row ${i + 2}`; },
  extendSample(eng, c) {
    const t = Ops.et(eng, c.id), plan = Engine.plannedSize(eng, c, S.meth), add = plan.extend || 1;
    const ds = eng.docs.find(d => d.id === t.datasetId && d.rows), total = ds ? ds.rows.length : t.popCount;
    const used = new Set(t.items.map(i => i.line)), pool = Engine.pick(total, total, t.seed + 7).filter(i => !used.has(i + 1)).slice(0, add);
    if (!pool.length) return 0;
    pool.forEach(i => t.items.push({ ref: ds ? Ops.rowRef(ds, i) : `Item ${i + 1} of ${t.popCount}`, line: i + 1, res: [], note: '', evidence: '', explanation: '', corroborated: false, accepted: false, ext: true }));
    Ops.log(eng, 'Sample extended', `${c.id}: +${pool.length} items to size the issue — conclusion unaffected`); return pool.length;
  },
  setResult(eng, c, i, a, v) {
    const t = Ops.et(eng, c.id), it = t.items[i]; while (it.res.length < c.attrs.length) it.res.push('');
    it.res[a] = v; t.preparer = t.preparer || me().name; t.reviewer = ''; Ops.syncToeGap(eng, c);
  },
  syncToeGap(eng, c) {
    const t = Ops.et(eng, c.id), st = Engine.toe(t, c.attrs.length), r = eng.risks.find(x => x.id === c.riskId);
    if (st.status !== 'ineffective') { Ops.dropGap(eng, 'toe:' + c.id); return; }
    const failed = new Set(); t.items.forEach(it => (it.res || []).forEach((v, a) => { if (v === 'f') failed.add(a); }));
    const facts = `In ${st.fails} of ${st.n} items tested, the control did not operate as described. Attribute(s) not met: ${[...failed].map(a => `"${c.attrs[a]}"`).join('; ')}.`;
    const g = Ops.ensureGap(eng, 'toe:' + c.id, { controlId: c.id, title: `${c.id} did not operate consistently`, desc: facts, cause: r.cause, criterion: criterionFor(r) });
    g.facts = facts;
  },
  review(eng, kind, cid) {
    const w = kind === 'd' ? Ops.dt(eng, cid) : Ops.et(eng, cid);
    if (!w.preparer || w.preparer === me().name) return false;
    w.reviewer = me().name; w.reviewedAt = new Date().toISOString(); Ops.log(eng, 'Working paper reviewed', `${cid} ${kind === 'd' ? 'design' : 'effectiveness'}`); return true;
  },

  /* ----- gaps ----- */
  ensureGap(eng, key, init) {
    let g = eng.gaps.find(x => x.key === key);
    if (g) return g;
    g = Object.assign({ id: Ops.id(eng, 'G'), key, controlId: '', title: '', desc: '', cause: '', rating: '', criterion: '', recommendation: '', response: '', owner: '', due: '', cleared: false, clearedWith: '', clearedAt: '', createdAt: new Date().toISOString() }, init);
    eng.gaps.push(g); Ops.log(eng, 'Gap raised', `${g.id}: ${g.title}`); return g;
  },
  dropGap(eng, key) {
    const g = eng.gaps.find(x => x.key === key); if (!g) return;
    if (g.cleared || String(g.response).trim()) { g.stale = true; return; }
    eng.gaps = eng.gaps.filter(x => x !== g); delete eng.followup[g.id]; Ops.log(eng, 'Gap withdrawn', `${g.id}: its cause no longer stands`);
  },

  /* ----- report ----- */
  issue(eng) { if (Engine.guards.issue(eng).length) return false; eng.report.issuedAt = new Date().toISOString(); eng.report.issuedBy = me().name; eng.gaps.forEach(g => { eng.followup[g.id] = eng.followup[g.id] || { status: 'open', evidence: '', note: '', revisedDue: '' }; }); Ops.log(eng, 'Report issued', `Overall rating: ${eng.report.overall} · ${eng.gaps.length} findings`); return true; },
};

      const isText = /\.(csv|tsv|txt)$/i.test(f.name) || /^text\//.test(f.type);
      const buf = await f.slice(0, 8e6).arrayBuffer();
      const text = isText && f.size < 6e6 ? await f.text() : null;
      await Ops.ingest(eng, f.name, f.size, f.type, text, buf); n++;
    } catch (e) { toast(`Could not read ${f.name}`); }
  }
  UI.busy = ''; commit(); toast(`${n} document${n === 1 ? '' : 's'} received and classified`);
}
async function askAI(prompt, label) {
  if (!Cap.sample) return null;
  UI.busy = label || 'Working…'; render();
  try { return await Cap.sample.json(prompt, { cache: false }); }
  catch (e) { const c = e && e.code; toast(c === 'not_granted' ? 'Assistant access was declined.' : c === 'rate_limited' ? 'Usage limit reached — try again later.' : c === 'invalid_json' ? 'The draft could not be read — try again.' : 'The assistant is unavailable right now.'); return null; }
  finally { UI.busy = ''; render(); }
}

/* ---------- binding ---------- */
function setPath(obj, path, v) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) { const k = /^\d+$/.test(ks[i]) ? +ks[i] : ks[i]; if (o[k] == null) o[k] = {}; o = o[k]; } const last = ks[ks.length - 1]; o[/^\d+$/.test(last) ? +last : last] = v; }
function target(eng, c, id) {
  if (c === 'meth') return S.meth;
  if (!c) return eng;
  const coll = eng[c];
  if (Array.isArray(coll)) return coll.find(x => x.id === id);
  return coll[id] || (coll[id] = c === 'dtests' ? Ops.blankD() : c === 'etests' ? Ops.blankE() : {});
}
function onChange(ev) {
  const el = ev.target;
  if (el.matches('input[type=file]')) { takeFiles([...el.files]); return; }
  if (el.dataset.change && !el.dataset.f) { Act[el.dataset.change](el.dataset, el, ev); commit(); return; }
  if (!el.dataset.f) return;
  const eng = E(), c = el.dataset.c || '', id = el.dataset.id || '', f = el.dataset.f;
  let v = el.type === 'checkbox' ? el.checked : el.value; if (el.dataset.num) v = Number(v) || 0;
  const t = target(eng, c, id); if (!t) return;
  setPath(t, f, v);
  if (c === 'controls' && f === 'type' && v === 'Automated') t.itDep = true;
  if (c === 'etests') { t.reviewer = ''; }
  if (c === 'gaps' && f === 'cleared') { t.clearedAt = v ? new Date().toISOString() : ''; }
  if (eng && c !== 'meth') { const d = `${c || 'scope'}${id ? ' ' + id : ''} · ${f.replace(/\.\d+/g, '')}`, last = eng.trail[eng.trail.length - 1]; if (!(last && last.a === 'Edited' && last.d === d && last.u === me().name)) Ops.log(eng, 'Edited', d); }
  if (el.dataset.change) Act[el.dataset.change](el.dataset, el, ev);
  commit();
}
/* Re-render is deferred while a pointer press is in flight, so a click that follows an edit still lands on its button. */
let renderPending = false;
const pressed = () => UI.ptr && Date.now() - UI.ptr < 600;
function commit() {
  Store.save(); if (renderPending) return; renderPending = true;
  const run = () => { if (pressed()) { setTimeout(run, 40); return; } renderPending = false; render(); };
  setTimeout(run, 0);
}

function boot() {

  const first = Store.load();

}

    <div class="card pad"><div class="row" style="margin-bottom:10px"><h3 style="font-size:14px">Out of scope</h3><span class="sp"></span>${lock ? '' : btn('Add exclusion', 'add-excl', { cls: 'sm', icon: IC.plus })}</div>
