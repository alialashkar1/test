      <tr><td>As and when</td><td colspan="3" class="small muted">Sized from the population, using the row whose annual count it matches</td></tr></tbody></table></div></div></div>
    <div class="stack"><div class="card pad"><h3 style="font-size:14px;margin-bottom:10px">Inherent risk bands <span class="small muted" style="font-weight:400">· likelihood × impact</span></h3>
      ${m.bands.map((b, i) => `<div class="row small" style="padding:4px 0"><span class="score t-${b.tone}">${i ? m.bands[i - 1].max + 1 : 1}–${b.max}</span><span style="min-width:110px">${esc(b.label)}</span><span class="muted">up to</span>${i < m.bands.length - 1 ? n(`bands.${i}.max`, b.max) : '<span class="mono">25</span>'}</div>`).join('')}</div>
      <div class="card pad"><h3 style="font-size:14px;margin-bottom:8px">Scales</h3><dl class="kv"><dt>Likelihood 1–5</dt><dd>${m.likelihood.map(esc).join(' · ')}</dd><dt>Impact 1–5</dt><dd>${m.impact.map(esc).join(' · ')}</dd><dt>Gap ratings</dt><dd>${m.gapRatings.map(esc).join(' · ')}</dd><dt>Overall ratings</dt><dd>${m.overall.map(esc).join(' · ')}</dd></dl></div></div></div>`;
};
Act['meth-reset'] = () => { S.meth = JSON.parse(JSON.stringify(DEFAULT_METH)); commit(); toast('Methodology restored to defaults'); };

/* Screens: risks & controls, procedure plan (Checkpoint 2), testing. */
const riskOf = (eng, c) => eng.risks.find(r => r.id === c.riskId) || {};
const D_ST = { '': ['mut', 'Design not concluded'], pass: ['good', 'Design pass'], fail: ['crit', 'Design fail'], absent: ['crit', 'No control'] };
const E_ST = { not_started: ['mut', 'Not started'], in_progress: ['info', 'In progress'], effective: ['good', 'Effective'], effective_limited: ['warn', 'Effective — limited'], ineffective: ['crit', 'Ineffective'],
  terminated: ['lock', 'Not tested — design failed'], not_key: ['mut', 'Not key'], blocked: ['lock', 'Awaiting design'], na: ['mut', '—'] };

/* ---------- risks & controls ---------- */
Views.risks = eng => {
  const cfg = Engine.typeCfg(eng.scope.type), sub = curSub(eng), steps = eng.steps.filter(s => s.sub === sub).sort((a, b) => a.n - b.n), lock = !!eng.cp2, o = { dis: lock };
  const risks = eng.risks.filter(r => r.sub === sub);
  const props = KB.sub(sub).risks.filter(L => !eng.risks.some(r => r.libId === L.id) && !eng.dismissed.some(x => x.libId === L.id));
  const dism = eng.dismissed.filter(x => x.sub === sub);
  const lik = S.meth.likelihood.map((l, i) => [i + 1, `${i + 1} — ${l}`]), imp = S.meth.impact.map((l, i) => [i + 1, `${i + 1} — ${l}`]);
  const ctlHTML = c => { const r = riskOf(eng, c);
    if (c.absent) return `<div class="ctl"><div class="row"><span class="tag">${c.id}</span>${chip('crit', 'No control exists')}${draftChip(c)}<span class="small muted">Absence recorded as ${esc((eng.gaps.find(g => g.key === 'absence:' + c.id) || {}).id || 'a gap')} — the inherent rating stands.</span><span class="sp"></span>${lock ? '' : `<button class="icon-btn sm" data-act="ctl-del" data-id="${c.id}" aria-label="Remove">${IC.x}</button>`}</div></div>`;
    return `<div class="ctl"><div class="row"><span class="tag">${c.id}</span><b class="small">Control as it operates today</b>${draftChip(c)}<span class="sp"></span>${chk('controls', c.id, 'key', c.key, 'Key control', o)}${chk('controls', c.id, 'itDep', c.itDep, 'Depends on IT general controls', o)}${lock ? '' : `<button class="icon-btn sm" data-act="ctl-del" data-id="${c.id}" aria-label="Remove control">${IC.x}</button>`}</div>
      ${ta('controls', c.id, 'desc', c.desc, { dis: lock, rows: 3, ph: 'Describe the control as performed — who does what, how often, and what evidences it' })}
      <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${fld('Owner (role)', inp('controls', c.id, 'owner', c.owner, o))}${fld('Nature', sel('controls', c.id, 'nature', c.nature, KB.natures, o))}${fld('Type', sel('controls', c.id, 'type', c.type, KB.ctlTypes, o))}${fld('Frequency', sel('controls', c.id, 'freq', c.freq, FREQS, { dis: lock, ph: 'Select…' }))}${fld('COSO principle', sel('controls', c.id, 'principle', c.principle, Object.keys(KB.coso.principles).map(n => [n, `P${n} ${KB.coso.principles[n]}`]), { dis: lock, num: true }))}${fld('Assertions', inp('controls', c.id, 'assertion', c.assertion, o))}</div>
      <div><div class="row" style="margin-bottom:5px"><span class="small" style="font-weight:600;color:var(--ink-2)">Test attributes</span><span class="xs faint">each a yes/no check that names who or what</span><span class="sp"></span>${lock ? '' : btn('Add attribute', 'attr-add', { cls: 'ghost sm', icon: IC.plus, data: { id: c.id } })}</div>
        ${c.attrs.map((a, i) => `<div class="attr-row" style="margin-bottom:5px"><span class="mono xs faint">A${i + 1}</span>${inp('controls', c.id, `attrs.${i}`, a, { dis: lock, ph: 'e.g. The sheet is approved by the finance director' })}${lock ? '' : `<button class="icon-btn sm" data-act="attr-del" data-id="${c.id}" data-i="${i}" aria-label="Remove attribute">${IC.x}</button>`}</div>`).join('')}</div></div>`; };
  const riskHTML = r => { const cs = eng.controls.filter(c => c.riskId === r.id), L = r.libId ? KB.libRisk(r.libId) : null;
    return `<div class="risk-card"><div class="risk-head"><div class="row" style="flex-wrap:nowrap"><span class="tag">${r.id}</span>${inp('risks', r.id, 'title', r.title, { dis: lock, ph: 'Risk title', cls: 'cell' })}${chip(r.source === 'library' ? 'mut' : r.source === 'ai' || r.source === 'agent' ? 'info' : 'prim', r.source === 'library' ? r.libId : r.source === 'ai' || r.source === 'agent' ? 'Agent' : 'Auditor', false)}${draftChip(r)}${lock ? '' : `<button class="icon-btn sm" data-act="risk-del" data-id="${r.id}" aria-label="Remove risk">${IC.trash}</button>`}</div>
      ${ta('risks', r.id, 'desc', r.desc, { dis: lock, rows: 2, ph: 'The condition in this process, and what it results in' })}
      <div class="form-grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${fld('Root cause', inp('risks', r.id, 'cause', r.cause, { dis: lock, list: 'rc-list' }))}${fld('Impact', inp('risks', r.id, 'impact', r.impact, { dis: lock, ph: 'In the organisation\'s terms' }))}${fld('Category', sel('risks', r.id, 'cat', r.cat, KB.categories, o))}${fld('Risk owner (role)', inp('risks', r.id, 'owner', r.owner, o))}
        ${fld('Arises at step', sel('risks', r.id, 'stepId', r.stepId, steps.map(s => [s.id, `${s.n}. ${s.action.slice(0, 42) || s.actor}`]), { dis: lock, ph: 'Not linked' }))}${fld('Likelihood', sel('risks', r.id, 'L', r.L, lik, { dis: lock, ph: 'Rate…', num: true }))}${fld('Impact rating', sel('risks', r.id, 'I', r.I, imp, { dis: lock, ph: 'Rate…', num: true }))}
        <div class="fld"><span class="small" style="font-weight:600;color:var(--ink-2)">Inherent risk</span><div class="row" style="min-height:31px">${scoreChip(r.L, r.I)}${chk('risks', r.id, 'fraud', r.fraud, 'Fraud risk', o)}</div></div></div></div>
      ${cfg.controls ? cs.map(ctlHTML).join('') + (lock ? '' : `<div class="ctl">${!cs.length && L ? `<div class="small muted"><b style="color:var(--ink)">Expected control (library):</b> ${esc(L.ctl.desc)}</div>` : ''}<div class="row">${cs.some(c => c.absent) ? '<span class="xs muted">Remove the absence to document a control instead.</span>' : btn(cs.length ? 'Add another control' : 'Document the control as-is', 'ctl-add', { cls: 'sm', icon: IC.plus, data: { id: r.id } })}${L && !cs.length ? btn('Start from the expected control', 'ctl-add', { cls: 'sm', data: { id: r.id, lib: 1 } }) : ''}${!cs.length ? btn('No control exists — record absence', 'ctl-absent', { cls: 'sm danger', data: { id: r.id } }) : ''}</div></div>`) : ''}</div>`; };
  return `<div class="page-head"><div><h1>${cfg.controls ? 'Risks &amp; controls' : 'Risks'}</h1><div class="sub">Risks come from the recorded process; each control is documented as it actually operates.</div></div></div>
    ${lock ? banner('info', `<b>The procedure plan is approved.</b> Risks and controls are fixed. Reopen the plan to change them.`) : ''}
    <datalist id="rc-list">${KB.rootCauses.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
    <div class="split" style="margin-top:${lock ? 12 : 0}px">${subList(eng, sub, 'risks', id => { const n = eng.risks.filter(r => r.sub === id), st = eng.steps.some(s => s.sub === id); const ok = n.length && n.every(r => r.L && r.I && (!cfg.controls || eng.controls.some(c => c.riskId === r.id))); return [ok ? 'done' : n.length ? 'active' : 'open', st ? `${n.length} risk${n.length === 1 ? '' : 's'}` : 'Process not recorded']; })}
    <div class="stack"><div class="row"><h2 style="font-size:16px">${esc(subName(sub))}</h2><span class="sp"></span>${steps.length && !lock ? btn('Add risk', 'risk-add', { cls: 'sm', icon: IC.plus }) : ''}</div>
      ${steps.length && !lock ? agentBar(`Built from the ${steps.length} recorded step${steps.length === 1 ? '' : 's'} and whatever the document library holds for this sub-process. The agent drafts each risk and the control as it operates, and lists the extra data it needs.`, btn('Build risks and controls here', 'ag-run', { cls: 'sm primary', icon: IC.bolt, data: { what: 'matrix', sub }, dis: !!Agent.busy }) + btn('Build the whole matrix', 'ag-run', { cls: 'sm', data: { what: 'matrix' }, dis: !!Agent.busy })) : ''}
      ${!lock && (risks.some(r => r.draft) || eng.controls.some(c => c.draft && risks.some(r => r.id === c.riskId))) ? banner('info', `<b>Drafted by the agent.</b> Check each risk and control against the walkthrough, rate likelihood and impact with the process owner, then accept. The plan cannot be approved while drafts are open. <span class="row" style="margin-top:7px">${btn('Accept the drafts here', 'accept-drafts', { cls: 'sm primary', data: { sub } })}</span>`) : ''}
      ${!steps.length ? banner('lock', `<b>Process before risk.</b> Record the steps of this sub-process first; risks are derived from how it actually runs. ${btn('Go to process understanding', 'stage', { cls: 'sm', data: { stage: 'understanding', sub } })}`) : `
      ${props.length && !lock ? `<div class="card pad stack" style="gap:9px"><div class="row"><h3 style="font-size:13.5px">Proposed from the library</h3><span class="xs faint">accept what applies here and rewrite it in this organisation's terms</span></div>
        ${props.map(L => `<div class="proposal"><div class="row"><span class="tag">${L.id}</span><b class="small">${esc(L.title)}</b>${L.fraud ? chip('crit', 'Fraud', false) : ''}<span class="sp"></span>${btn('Accept', 'lib-accept', { cls: 'sm primary', data: { lib: L.id } })}${btn('Does not apply', 'lib-dismiss', { cls: 'sm ghost', data: { lib: L.id } })}</div><div class="small muted">${esc(L.desc)}</div><div class="xs faint">Criterion: COSO Principle ${L.principle} — ${esc(KB.coso.principles[L.principle])}</div></div>`).join('')}</div>` : ''}
      ${risks.map(riskHTML).join('') || (props.length ? '' : empty('No risks yet', 'Add the risks that arise in this sub-process.', ''))}
      ${dism.length ? `<div class="xs muted">${dism.map(x => `${x.libId} set aside — “${esc(x.reason)}” (${esc(x.by)}) <button class="btn ghost sm" style="padding:1px 6px" data-act="lib-restore" data-lib="${x.libId}">Restore</button>`).join('<br>')}</div>` : ''}`}
    </div></div>`;
};
Act['lib-accept'] = d => { const eng = E(); Ops.acceptLib(eng, curSub(eng), d.lib); commit(); };
Act['lib-dismiss'] = d => ask({ title: 'Set this risk aside', text: 'Recorded so a reviewer can see the risk was considered and why it does not apply here.', fields: [{ id: 'r', label: 'Why does it not apply?', type: 'textarea' }], ok: 'Set aside' }, v => { const eng = E(); eng.dismissed.push({ libId: d.lib, sub: curSub(eng), reason: v.r, by: me().name, at: new Date().toISOString() }); Ops.log(eng, 'Library risk set aside', `${d.lib}: ${v.r}`); });
Act['lib-restore'] = d => { const eng = E(); eng.dismissed = eng.dismissed.filter(x => x.libId !== d.lib); commit(); };
Act['risk-add'] = () => { const eng = E(); Ops.addRisk(eng, curSub(eng)); commit(); };
Act['risk-del'] = d => ask({ title: `Remove ${d.id}?`, text: 'Its controls, tests and any gaps raised from them are removed too.', ok: 'Remove', danger: true }, () => Ops.removeRisk(E(), d.id));
Act['ctl-add'] = d => { Ops.addControl(E(), d.id, !!d.lib); commit(); };
Act['ctl-absent'] = d => { const g = Ops.recordAbsence(E(), d.id); commit(); toast('Absence recorded and raised as a gap'); };
Act['ctl-del'] = d => { Ops.removeControl(E(), d.id); commit(); };
Act['attr-add'] = d => { E().controls.find(c => c.id === d.id).attrs.push(''); commit(); };
Act['attr-del'] = d => { const eng = E(), c = eng.controls.find(x => x.id === d.id); c.attrs.splice(+d.i, 1); const t = eng.etests[c.id]; if (t) t.items.forEach(it => it.res && it.res.splice(+d.i, 1)); commit(); };
/* ---------- procedure plan (Checkpoint 2) ---------- */
Views.plan = eng => {
  const cfg = Engine.typeCfg(eng.scope.type), lock = !!eng.cp2, g = Engine.guards.cp2(eng), itg = Engine.itgc(eng), live = eng.controls.filter(c => !c.absent), abs = eng.controls.filter(c => c.absent);
  const dsets = eng.docs.filter(d => d.rows);
  return `<div class="page-head"><div><h1>Procedure plan</h1><div class="sub">Checkpoint 2 — the work that will be done, sized from each control's frequency, approved before it starts.</div></div><div class="acts">${lock ? btn('Reopen plan', 'reopen-plan') : ''}</div></div>
    ${lock ? banner('good', `<b>Approved</b> by ${esc(eng.cp2.by)} on ${fmtDate(eng.cp2.at)}.`) : ''}
    <div class="stack" style="margin-top:14px">
    ${live.length ? `<div class="tbl-wrap"><table><thead><tr><th>Control</th><th>Addresses</th><th>Test of design</th><th>Frequency</th><th class="num">Population</th><th>Test of effectiveness</th><th>Override</th></tr></thead><tbody>
    ${live.map(c => { const r = riskOf(eng, c), p = Engine.sampleSize(c, (eng.etests[c.id] || {}).popCount, S.meth);
    return `<tr><td><span class="tag">${c.id}</span>${c.itDep ? `<div style="margin-top:4px">${chip(itg.status === 'failed' ? 'crit' : itg.status === 'effective' ? 'good' : 'warn', 'ITGC ' + itg.status)}</div>` : ''}</td><td class="small" style="min-width:180px"><span class="tag">${r.id}</span> ${esc(r.title)}</td><td class="small">Walkthrough of one instance · five design factors</td><td class="small">${esc(freqLabel(c.type === 'Automated' ? 'automated' : c.freq))}</td>
      <td class="tight num">${c.key ? `<input class="inp cell" style="width:80px;text-align:right" type="number" min="0" value="${(eng.etests[c.id] || {}).popCount || ''}" placeholder="—" data-c="etests" data-id="${c.id}" data-f="popCount" data-num="1" ${lock && cfg.testing ? '' : ''} aria-label="Population">` : ''}</td>
      <td class="small" style="min-width:230px">${c.key ? `<b>${p.size == null ? '—' : 'Sample of ' + p.size}</b>${c.attrs.filter(a => a.trim()).length ? ` · ${c.attrs.filter(a => a.trim()).length} attributes` : ''}<div class="xs muted">${esc(p.basis)}</div>` : '<span class="muted">Not a key control — design only</span>'}</td>
      <td class="tight" style="min-width:210px">${c.key ? `<div class="row" style="flex-wrap:nowrap;gap:5px"><input class="inp cell" style="width:64px" type="number" min="0" value="${c.planSize || ''}" placeholder="size" data-c="controls" data-id="${c.id}" data-f="planSize" data-num="1" ${lock ? 'disabled' : ''} aria-label="Override sample size">${c.planSize ? inp('controls', c.id, 'planReason', c.planReason, { cls: 'cell ' + (c.planReason ? '' : 'bad'), ph: 'Reason (required)', dis: lock }) : ''}</div>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div>` : empty('Nothing to plan yet', 'Identify risks and document their controls first.', '')}
    ${abs.length ? `<div class="card pad"><h3 style="font-size:13.5px;margin-bottom:6px">Absences — no test; raised directly as gaps</h3>${abs.map(c => `<div class="small" style="padding:3px 0"><span class="tag">${c.id}</span> ${esc(riskOf(eng, c).title)}</div>`).join('')}</div>` : ''}
    ${live.some(c => c.itDep) ? `<div class="card pad stack" style="gap:9px"><div class="row"><h3 style="font-size:13.5px">IT general controls conclusion</h3>${chip(itg.status === 'failed' ? 'crit' : itg.status === 'effective' ? 'good' : 'warn', itg.status)}</div>
      ${itg.auto ? `<p class="small muted">Computed from the IT general controls tested in this engagement.</p>` : `<div class="form-grid">${fld('Conclusion relied upon', sel('', '', 'itgc.status', eng.itgc.status, [['pending', 'Pending — not yet concluded'], ['effective', 'Effective'], ['failed', 'Failed']]))}${fld('Source of the conclusion', inp('', '', 'itgc.note', eng.itgc.note, { ph: 'Which engagement or report' }))}</div>`}
      <p class="xs muted">${live.filter(c => c.itDep).map(c => c.id).join(', ')} depend${live.filter(c => c.itDep).length === 1 ? 's' : ''} on it. If it has failed, their design fails as a consequence and effectiveness is not tested.</p></div>` : ''}
    ${dsets.length >= 2 ? `<div class="card pad"><div class="row"><h3 style="font-size:13.5px">Full-population work available</h3><span class="sp"></span>${btn('Open data analysis', 'stage', { cls: 'sm', data: { stage: 'analysis' } })}</div><p class="small muted" style="margin-top:4px">${dsets.length} tabular data sets are loaded (${esc(dsets.map(d => d.docType).join(', '))}). Reconcile them across the whole population instead of sampling.</p></div>` : ''}
    ${lock ? '' : `${g.length ? banner('warn', `<b>Before the plan can be approved</b>${guardList(g)}`) : banner('good', 'The plan is complete and can be approved.')}<div class="row">${btn(cfg.testing ? 'Approve plan — Checkpoint 2' : 'Approve test plans — Checkpoint 2', 'approve-plan', { cls: 'primary', icon: IC.check, dis: g.length > 0 })}</div>`}</div>`;

Act['approve-plan'] = () => { const eng = E(); if (Ops.approvePlan(eng)) { toast('Plan approved'); go('eng', Engine.typeCfg(eng.scope.type).testing ? 'testing' : 'outputs'); } };
Act['reopen-plan'] = () => ask({ title: 'Reopen the procedure plan?', text: 'Risks and controls become editable again. Test results already recorded are kept.', fields: [{ id: 'r', label: 'Reason', type: 'textarea' }], ok: 'Reopen' }, v => Ops.reopenPlan(E(), v.r));

/* ---------- testing ---------- */
Views.testing = eng => {
  const live = eng.controls.filter(c => !c.absent);
  if (!live.length) return `<div class="page-head"><div><h1>Testing</h1></div></div>${empty('No controls to test', 'Every risk in this engagement has an absence recorded.', '')}`;
  const c = live.find(x => x.id === S.ui.ctl) || live[0]; S.ui.ctl = c.id;
  const r = riskOf(eng, c), st = Engine.controlStatus(eng, c), d = Ops.dt(eng, c.id), dl = !!d.conclusion, od = { dis: dl };
  const blockers = Ops.designBlockers(eng, c), itg = Engine.itgc(eng), docOpts = eng.docs.map(x => [x.id, x.name]);
  const reviewRow = (kind, w) => w.preparer ? `<div class="row small muted">Prepared by <b style="color:var(--ink)">${esc(w.preparer)}</b>${w.reviewer ? ` · reviewed by <b style="color:var(--ink)">${esc(w.reviewer)}</b> ${fmtDT(w.reviewedAt)}` : ` · ${chip('warn', 'Not reviewed')}`}<span class="sp"></span>${w.reviewer ? '' : btn('Sign off as reviewer', 'review', { cls: 'sm', data: { kind, id: c.id }, dis: w.preparer === me().name, title: w.preparer === me().name ? 'The preparer cannot review their own working paper — switch user' : '' })}</div>` : '';

  const design = `<div class="card pad stack"><div class="row"><h3 style="font-size:14.5px">Test of design</h3>${chip(...D_ST[st.design])}</div>
    ${c.itDep ? banner(itg.status === 'failed' ? 'crit' : itg.status === 'effective' ? 'good' : 'warn', `This control depends on IT general controls — conclusion: <b>${esc(itg.status)}</b>${eng.itgc.note && !itg.auto ? ` (${esc(eng.itgc.note)})` : ''}.`) : ''}
    ${eng.steps.some(s => s.sub === r.sub) ? `<details class="fold"><summary>Process flow — ${esc(subName(r.sub))}</summary>${flowSVG(eng, r.sub, { hi: r.stepId })}${flowLegend}</details>` : ''}
    ${fld('What will be obtained and checked', ta('dtests', c.id, 'plan', d.plan, { dis: dl, rows: 2 }))}
    ${fld('Walkthrough performed', ta('dtests', c.id, 'walkthrough', d.walkthrough, { dis: dl, rows: 3, ph: 'The single instance examined: documents, roles and dates in sequence' }), 'one real instance')}
    <div class="form-grid">${fld('Walkthrough date', inp('dtests', c.id, 'date', d.date, { type: 'date', dis: dl }))}
      <div class="fld"><span class="small" style="font-weight:600;color:var(--ink-2)">Evidence examined</span><div class="row">${d.docIds.map(id => { const x = eng.docs.find(y => y.id === id); return x ? `<span class="tag">${esc(x.name)}${dl ? '' : ` <button class="btn ghost sm" style="padding:0 2px" data-act="d-doc-del" data-id="${c.id}" data-doc="${id}" aria-label="Unlink">×</button>`}</span>` : ''; }).join('')}
        ${dl ? '' : `<select class="inp" style="width:auto;max-width:220px" data-change="d-doc-add" data-id="${c.id}" aria-label="Link a document"><option value="">Link a document…</option>${docOpts.filter(x => !d.docIds.includes(x[0])).map(x => `<option value="${x[0]}">${esc(x[1])}</option>`).join('')}</select>`}</div></div></div>
    <div class="stack" style="gap:8px">${KB.factors.map((f, i) => `<div class="factor"><div class="fn">${i + 1}</div>${fld(f[0], ta('dtests', c.id, `factors.${i}`, d.factors[i], { dis: dl, rows: 2 }), f[1])}</div>`).join('')}</div>

      : `${blockers.length ? banner('warn', `<b>Before design can pass</b>${guardList(blockers)}`) : ''}<div class="row">${btn('Conclude — design passes', 'd-pass', { cls: 'primary', icon: IC.check, dis: blockers.length > 0, data: { id: c.id } })}${btn('Conclude — design fails', 'd-fail', { cls: 'danger', data: { id: c.id } })}</div>`}</div>`;

  let eff;

  else {
    const t = Ops.et(eng, c.id), plan = Engine.plannedSize(eng, c, S.meth), res = Engine.toe(t, c.attrs.length), has = t.items.length > 0;

      ${t.completeness ? fld(t.completeness === 'reconciled' ? 'Basis — what it was reconciled to' : 'Limitation — why it could not be established', ta('etests', c.id, 'completenessBasis', t.completenessBasis, { rows: 2 })) : ''}
      <div class="row"><span class="small"><b>Sample size ${plan.size == null ? '—' : plan.size}</b> <span class="muted">· ${esc(plan.basis)}</span></span><span class="sp"></span>${has ? btn('Re-select sample', 'reselect', { cls: 'sm ghost', data: { id: c.id } }) : btn('Select sample', 'select-sample', { cls: 'primary sm', data: { id: c.id }, dis: !t.popCount || !plan.size, title: !t.popCount ? 'Enter the population first — population before sample' : '' })}</div>

        ${t.items.map((it, i) => `<tr class="${(it.res || []).includes('f') ? 'flag' : ''}"><td class="mono xs">${i + 1}${it.ext ? '<div class="xs faint">ext.</div>' : ''}</td><td class="tight" style="min-width:190px">${inp('etests', c.id, `items.${i}.ref`, it.ref, { cls: 'cell' })}</td>
          ${c.attrs.map((a, k) => { const v = (it.res || [])[k] || ''; return `<td class="tight"><button class="tri ${v}" data-act="tri" data-id="${c.id}" data-i="${i}" data-a="${k}" aria-label="Attribute ${k + 1}, item ${i + 1}: ${v === 'p' ? 'met' : v === 'f' ? 'not met' : v === 'n' ? 'not applicable' : 'not tested'}">${v === 'p' ? '✓' : v === 'f' ? '✕' : v === 'n' ? 'n/a' : ''}</button></td>`; }).join('')}

        <div class="xs muted">${c.attrs.map((a, i) => `<div><b class="mono">A${i + 1}</b> ${esc(a)}</div>`).join('')}<div style="margin-top:4px">Click a cell to cycle: met ✓ · not met ✕ · not applicable · untested. Selection seed ${t.seed}.</div></div>

Act['d-doc-add'] = (d, el) => { if (el.value) Ops.dt(E(), d.id).docIds.push(el.value); };

Act['d-pass'] = d => { const eng = E(), c = eng.controls.find(x => x.id === d.id); if (Ops.designBlockers(eng, c).length) return; Ops.concludeDesign(eng, c, 'pass'); commit(); toast('Design passes — effectiveness testing is open'); };

Act.reselect = d => ask({ title: 'Re-select the sample?', text: 'The current items and their results are discarded. The reason is recorded.', fields: [{ id: 'r', label: 'Reason', type: 'textarea' }], ok: 'Re-select', danger: true }, v => { const eng = E(), c = eng.controls.find(x => x.id === d.id); Ops.et(eng, c.id).items = []; Ops.log(eng, 'Sample discarded', `${c.id}: ${v.r}`); Ops.syncToeGap(eng, c); Ops.selectSample(eng, c); });
Act.tri = d => { const eng = E(), c = eng.controls.find(x => x.id === d.id), it = Ops.et(eng, c.id).items[+d.i], cur = (it.res || [])[+d.a] || '', next = { '': 'p', p: 'f', f: 'n', n: '' }[cur];

Act.extend = d => { const eng = E(), n = Ops.extendSample(eng, eng.controls.find(x => x.id === d.id)); commit(); toast(n ? `${n} items added — the conclusion is unchanged` : 'The whole population is already in the sample'); };
Act['resolve-exc'] = d => { const eng = E(), c = eng.controls.find(x => x.id === d.id), it = Ops.et(eng, c.id).items[+d.i];
  it.res = it.res.map(v => v === 'f' ? 'p' : v); it.resolved = true; it.note = (it.note ? it.note + ' ' : '') + `[Resolved: ${it.explanation} — corroborated]`;
  Ops.log(eng, 'Exception resolved on corroboration', `${c.id} item ${+d.i + 1}: ${it.explanation}`); Ops.syncToeGap(eng, c); commit(); };

/* ---------- data analysis ---------- */
UI.an = { src: ['', '', ''], keys: [['', ''], ['', ''], ['', '']], amt: ['', '', ''], tol: 0, dup: { ds: '', c1: '', c2: '' }, thr: { ds: '', col: '', thr: '', pct: 5 }, open: '' };

        ${fld('Limitations', ta('', '', 'report.limitations', eng.report.limitations, { rows: 3, dis: issued }))}
        ${issued ? '' : `<div class="row">${btn('List limitations from the file', 'limits', { cls: 'sm ghost' })}</div>`}</div>
      <div class="row">${issued ? '' : btn('Issue report', 'issue', { cls: 'primary', icon: IC.check, dis: g.length > 0 })}${btn('Export HTML', 'x-report', { icon: IC.down })}${btn('Copy text', 'c-report', { cls: 'ghost', icon: IC.copy })}</div>
    </div><div class="report" id="report">${reportInner(eng)}</div></div>`; }
  return `<div class="page-head"><div><h1>Report &amp; outputs</h1><div class="sub">Rendered from the working papers. Nothing here is typed twice.</div></div></div>${tabs('out', tabList, 'report')}${body}`;
};
Act.compose = () => { const eng = E(), gaps = eng.gaps, live = eng.controls.filter(c => !c.absent), sts = live.map(c => Engine.controlStatus(eng, c)), hi = gaps.filter(g => g.rating === 'High');
  eng.report.summary = `We examined ${live.length} control${live.length === 1 ? '' : 's'} over ${eng.scope.processes.map(subName).join(', ').toLowerCase()} for the period ${eng.scope.periodFrom} to ${eng.scope.periodTo}. ${sts.filter(x => x.eff === 'effective' || x.eff === 'effective_limited').length} operated effectively, ${sts.filter(x => x.eff === 'ineffective').length} did not, ${sts.filter(x => x.design === 'fail').length} failed on design, and ${eng.controls.filter(c => c.absent).length} expected control${eng.controls.filter(c => c.absent).length === 1 ? ' was' : 's were'} absent.\n\n${gaps.length} finding${gaps.length === 1 ? ' is' : 's are'} reported${hi.length ? `, of which ${hi.length} ${hi.length === 1 ? 'is' : 'are'} rated high: ${hi.map(g => g.title).join('; ')}` : ''}. Management has agreed actions with named owners and dates for each.`;
  Ops.log(eng, 'Executive summary composed from findings'); commit(); };
Act.limits = () => { const eng = E(), l = []; eng.controls.forEach(c => { const t = eng.etests[c.id]; if (t && t.items.length && t.completeness !== 'reconciled') l.push(`${c.id}: the completeness of the population could not be established; the conclusion covers the items tested only.`); });
  eng.requests.filter(q => q.status === 'pending' || q.status === 'incomplete').forEach(q => l.push(`Requested and not received in usable form: ${q.item}.`));
  eng.docs.filter(d => /client/i.test(d.strength)).length && l.push(`${eng.docs.filter(d => /client/i.test(d.strength)).length} data sets were extracted or prepared by the client rather than by the auditor.`);
  eng.report.limitations = l.join('\n') || 'No limitations arise from the file.'; commit(); };
Act['ai-summary'] = async () => { const eng = E(); const out = await askAI(`Write the executive summary of an internal audit report in 2 short paragraphs for an audit committee. Use ONLY the facts given; no invented numbers. Reply with only JSON {"summary": "..."}.\n\nENGAGEMENT: ${eng.scope.name}, ${eng.scope.client}, ${eng.scope.periodFrom} to ${eng.scope.periodTo}. OVERALL RATING: ${eng.report.overall || 'not yet decided'}.\nFINDINGS: ${JSON.stringify(eng.gaps.map(g => ({ title: g.title, rating: g.rating, finding: g.desc, cause: g.cause, action: g.response, owner: g.owner, due: g.due })))}`, 'Drafting summary…'); if (out && out.summary) { eng.report.summary = String(out.summary); Ops.log(eng, 'Executive summary drafted by the assistant', 'to be checked by the engagement lead'); commit(); } };
Act.issue = () => { const eng = E(); if (Ops.issue(eng)) { commit(); toast('Report issued — follow-up is open'); } };
const reportDoc = eng => `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${esc(eng.scope.name)} — internal audit report</title><style>body{font:14px/1.5 system-ui,sans-serif;color:#16202a;max-width:900px;margin:30px auto;padding:0 20px}h2{font-size:22px;margin:4px 0}h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#667;margin:24px 0 8px}.cover{border-bottom:2px solid #0b6e63;padding-bottom:14px}.k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#0b6e63;font-weight:700}.dash{display:flex;gap:8px;flex-wrap:wrap}.dash div{border:1px solid #ccd;border-radius:6px;padding:8px 12px;text-align:center}.dash b{display:block;font-size:18px}.dash span{font-size:11px;color:#667}dl{display:grid;grid-template-columns:150px 1fr;gap:5px 14px}dt{color:#667;font-weight:600}dd{margin:0;white-space:pre-wrap}.obs{border:1px solid #ccd;border-radius:6px;margin-bottom:10px;padding:10px 14px}.oh{display:flex;gap:8px;align-items:center}h4{margin:0;font-size:14px}.tag{font:11px monospace;border:1px solid #ccd;border-radius:4px;padding:1px 5px}.chip{font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;background:#eee}.c-crit{background:#f8dedb;color:#b3261e}.c-warn{background:#f8ead0;color:#9a5a06}.c-good{background:#def0e2;color:#1a7f44}table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{border-bottom:1px solid #dde;padding:6px 8px;text-align:left;vertical-align:top}.score{font:700 12px monospace;color:#fff;border-radius:5px;padding:2px 7px}.t-1{background:#1a7f44}.t-2{background:#5f8a17}.t-3{background:#b06a10}.t-4{background:#b3261e}.t-5{background:#7d1612}.muted{color:#667}.small{font-size:12.5px}</style></head><body>${reportInner(eng)}</body></html>`;
Act['x-report'] = () => { const eng = E(); saveFile(`${(eng.scope.name || 'report').replace(/[^\w]+/g, '-').toLowerCase()}.html`, reportDoc(eng)); };
Act['c-report'] = () => copyText($('#report').innerText);
Act['x-matrix'] = () => { const rows = matrixRows(E()); saveFile('risk-control-matrix.csv', toCSV([['Sub-process', 'Risk ID', 'Risk', 'Root cause', 'Likelihood', 'Impact', 'Inherent score', 'Inherent rating', 'Control ID', 'Control as-is', 'Owner', 'Nature', 'Type', 'Frequency', 'Key', 'COSO principle', 'Assertions', 'Design', 'Sample size', 'Effectiveness', 'Gap', 'Gap rating'], ...rows.map(r => [r.sub, r.rid, r.risk, r.cause, r.L, r.I, r.score, r.band, r.cid, r.ctl, r.owner, r.nature, r.type, r.freq, r.key, r.principle, r.assertion, r.design, r.sample, r.eff, r.gap, r.gRating])])); };
Act['x-register'] = () => { const eng = E(); saveFile('risk-register.csv', toCSV([['Ref', 'Sub-process', 'Risk', 'Description', 'Root cause', 'Impact', 'Category', 'Fraud risk', 'Owner', 'Likelihood', 'Impact rating', 'Inherent score', 'Rating'], ...eng.risks.map(r => { const s = Engine.riskScore(r.L, r.I, S.meth); return [r.id, subName(r.sub), r.title, r.desc, r.cause, r.impact, r.cat, r.fraud ? 'Yes' : 'No', r.owner, r.L, r.I, s ? s.score : '', s ? s.band : '']; })])); };

/* ---------- follow-up ---------- */
const FU = [['open', 'Open'], ['in_progress', 'In progress'], ['implemented', 'Implemented — evidenced'], ['superseded', 'Superseded']];
Views.followup = eng => { const today = Engine.today();
  return `<div class="page-head"><div><h1>Follow-up</h1><div class="sub">An action closes on evidence of implementation, not on a status update.</div></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Finding</th><th>Agreed action</th><th>Owner</th><th>Target</th><th>Revised</th><th>Status</th><th>Evidence of implementation</th><th>Note</th></tr></thead><tbody>
    ${eng.gaps.map(g => { const f = eng.followup[g.id] || (eng.followup[g.id] = { status: 'open', evidence: '', note: '', revisedDue: '' }), due = f.revisedDue || g.due, late = !['implemented', 'superseded'].includes(f.status) && due && due < today;
    return `<tr class="${late ? 'flag' : ''}"><td style="min-width:180px"><span class="tag">${g.id}</span> ${chip(ratingTone(g.rating), g.rating, false)}<div class="small" style="margin-top:3px">${esc(g.title)}</div></td><td class="small" style="min-width:220px">${esc(g.response)}</td><td class="small">${esc(g.owner)}</td><td class="mono xs" style="white-space:nowrap">${esc(g.due)}${late ? `<div style="color:var(--crit);font-family:var(--sans);font-weight:600">Overdue</div>` : ''}</td>
      <td class="tight">${inp('followup', g.id, 'revisedDue', f.revisedDue, { cls: 'cell', type: 'date' })}</td>
      <td class="tight" style="min-width:180px"><select class="inp cell" data-change="fu-status" data-id="${g.id}" aria-label="Status">${FU.map(x => `<option value="${x[0]}" ${f.status === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}</select></td>
      <td class="tight" style="min-width:180px">${sel('followup', g.id, 'evidence', f.evidence, eng.docs.map(d => [d.id, d.name]), { cls: 'cell', ph: 'None — upload under documents' })}</td><td class="tight" style="min-width:180px">${inp('followup', g.id, 'note', f.note, { cls: 'cell', ph: f.status === 'superseded' ? 'What changed, and is the risk addressed?' : '' })}</td></tr>`; }).join('')}</tbody></table></div>`;
};
Act['fu-status'] = (d, el) => { const eng = E(), f = eng.followup[d.id];
  if (el.value === 'implemented' && !f.evidence) { toast('Link the evidence of implementation first — an action closes on evidence'); return; }
  if (el.value === 'superseded' && !String(f.note).trim()) { toast('Record what changed and whether the risk is now addressed'); return; }
  f.status = el.value; if (el.value === 'implemented') f.closedAt = new Date().toISOString(); Ops.log(eng, 'Follow-up status changed', `${d.id}: ${el.value}`); };

/* ---------- audit trail ---------- */
Views.trail = eng => `<div class="page-head"><div><h1>Audit trail</h1><div class="sub">Every change to this file: who, what, when. Entries cannot be edited or removed.</div></div><div class="acts">${btn('Export CSV', 'x-trail', { icon: IC.down })}</div></div>
  <div class="tbl-wrap"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead><tbody>${eng.trail.slice().reverse().map(t => `<tr><td class="mono xs" style="white-space:nowrap">${esc(t.t.replace('T', ' ').slice(0, 19))}</td><td class="small" style="white-space:nowrap">${esc(t.u)}</td><td class="small" style="font-weight:600;white-space:nowrap">${esc(t.a)}</td><td class="small muted">${esc(t.d)}</td></tr>`).join('')}</tbody></table></div>`;
Act['x-trail'] = () => saveFile('audit-trail.csv', toCSV([['when', 'who', 'action', 'detail'], ...E().trail.map(t => [t.t, t.u, t.a, t.d])]));

/* a handle for automated tests and the browser console */
window.Throughline = { Seed, Agent, Ops, Engine, get S() { return S; }, render };
boot();

})();
</script>
