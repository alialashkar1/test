<meta name="claude:viewport-fit-sides" content="cover">
<title>Throughline Audit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: context rail + sticky topbar + scrolling work area. A working tool: dense, quiet, state-forward. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f4f6f8; --surface-3:#e9edf1;
  --border:#dde2e7; --border-strong:#c6ced6;
  --ink:#16202a; --ink-2:#55626d; --ink-3:#8b96a0;
  --primary:#0b6e63; --primary-ink:#08534a; --primary-bg:#def0ed;
  --good:#1a7f44; --good-bg:#def0e2;
  --warn:#9a5a06; --warn-bg:#f8ead0;
  --crit:#b3261e; --crit-bg:#f8dedb;
  --info:#1f52c4; --info-bg:#e0e8fb;
  --locked:#7b8690; --locked-bg:#e9edf1;
  --shadow:0 1px 2px rgba(20,32,42,.06),0 2px 8px rgba(20,32,42,.05);
  --radius:9px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1317; --surface:#151d23; --surface-2:#1a232a; --surface-3:#222d35;
  --border:#26323a; --border-strong:#364550;
  --ink:#e7edf1; --ink-2:#9aa6af; --ink-3:#687480;
  --primary:#36c9b8; --primary-ink:#8fe6db; --primary-bg:#123c38;
  --good:#45c874; --good-bg:#153522; --warn:#e0a53a; --warn-bg:#3a2e14;
  --crit:#f0756c; --crit-bg:#3c1d1a; --info:#7ea2f0; --info-bg:#1a2744;
  --locked:#7f8b95; --locked-bg:#222c34;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1317; --surface:#151d23; --surface-2:#1a232a; --surface-3:#222d35;
  --border:#26323a; --border-strong:#364550;
  --ink:#e7edf1; --ink-2:#9aa6af; --ink-3:#687480;
  --primary:#36c9b8; --primary-ink:#8fe6db; --primary-bg:#123c38;
  --good:#45c874; --good-bg:#153522; --warn:#e0a53a; --warn-bg:#3a2e14;
  --crit:#f0756c; --crit-bg:#3c1d1a; --info:#7ea2f0; --info-bg:#1a2744;
  --locked:#7f8b95; --locked-bg:#222c34;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono)} .tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:12px} .xs{font-size:11px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--primary);outline-offset:1px;border-radius:4px}

/* shell */
#app{height:100%}
.app{display:grid;grid-template-columns:252px 1fr;height:100%}
.rail{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:10px;padding:15px 16px 13px;border-bottom:1px solid var(--border)}
.logo{width:30px;height:30px;border-radius:8px;background:var(--primary);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px}
.brand-name{font-weight:700;letter-spacing:-.02em;font-size:15px;line-height:1.1}
.brand-sub{font-size:10px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.nav{padding:8px 10px;overflow-y:auto;flex:1;min-height:0}
.nav-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:12px 8px 5px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;color:var(--ink-2);padding:7px 9px;border-radius:7px;font-size:13.5px;font-weight:500;line-height:1.2}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--primary-bg);color:var(--primary-ink);font-weight:600}
.nav-item.locked{color:var(--ink-3)}
.nav-item svg{width:15px;height:15px;flex:none}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.sdot{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:9px;font-weight:700}
.sdot svg{width:10px;height:10px}
.sd-done{background:var(--good-bg);color:var(--good)} .sd-active{background:var(--warn-bg);color:var(--warn)} .sd-locked{background:var(--locked-bg);color:var(--locked)} .sd-open{background:var(--surface-3);color:var(--ink-3)}
.eng-head{padding:10px 8px 4px}
.eng-head .en{font-weight:600;font-size:13.5px;line-height:1.25}
.eng-head .ec{font-size:11.5px;color:var(--ink-3)}
.rail-foot{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:9px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.who{font-size:12px;line-height:1.25;min-width:0;text-align:left;border:0;background:none;padding:0;flex:1}
.who b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{color:var(--ink-3);font-size:11px}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:7px;width:30px;height:30px;display:inline-grid;vertical-align:middle;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--border-strong)}
.icon-btn svg{width:15px;height:15px}
.icon-btn.sm{width:26px;height:26px;border-radius:6px}
.main{min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:10px max(18px,env(safe-area-inset-right,0px)) 10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:51px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.topbar .sp{flex:1}
.content{padding:20px max(20px,env(safe-area-inset-right,0px)) 80px max(20px,env(safe-area-inset-left,0px));max-width:1240px;width:100%}
.page-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:21px}
.page-head .sub{color:var(--ink-2);font-size:13px;margin-top:3px}
.page-head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;line-height:1.1;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary-ink)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#06211d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#06211d}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--border))}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn:disabled:hover{border-color:var(--border-strong);color:inherit}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--border-strong);background:var(--surface);border-radius:7px;padding:6px 9px;line-height:1.35;min-width:0}
textarea.inp{resize:vertical;min-height:58px}
.inp:disabled{background:var(--surface-2);color:var(--ink-2)}
.inp.cell{border-color:transparent;background:transparent;padding:4px 6px;border-radius:5px}
.inp.cell:hover{border-color:var(--border)}
.inp.cell:focus{border-color:var(--primary);background:var(--surface)}
.inp.bad{border-color:var(--crit)}
label.fld{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
label.fld .hint{font-weight:400;color:var(--ink-3)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--ink)}
.chk input{width:15px;height:15px;accent-color:var(--primary)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.5;white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.c-good{background:var(--good-bg);color:var(--good)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-crit{background:var(--crit-bg);color:var(--crit)}
.c-info{background:var(--info-bg);color:var(--info)} .c-lock{background:var(--locked-bg);color:var(--locked)} .c-prim{background:var(--primary-bg);color:var(--primary-ink)} .c-mut{background:var(--surface-3);color:var(--ink-2)}
.tag{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);padding:1px 6px;border-radius:5px;white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:15px 17px}
.stack{display:grid;gap:14px;min-width:0}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.h-sec{display:flex;align-items:center;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.h-sec h2{font-size:14.5px}
.h-sec .hint{font-size:12px;color:var(--ink-3)}
.h-sec .line{flex:1;height:1px;background:var(--border);min-width:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.stat .lbl{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.stat .val{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .val small{font-size:12.5px;color:var(--ink-3);font-weight:500}
.stat .sub{font-size:11.5px;color:var(--ink-2)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:0}
td.tight{padding:4px 5px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.flag td{background:color-mix(in srgb,var(--crit-bg) 55%,transparent)}

/* banners & guards */
.banner{display:flex;gap:10px;padding:11px 13px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-2);font-size:12.5px;align-items:flex-start}
.banner svg{width:16px;height:16px;flex:none;margin-top:2px}
.banner.lock{background:var(--locked-bg);color:var(--ink-2);border-style:dashed;border-color:var(--border-strong)}
.banner.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--ink)}
.banner.warn svg{color:var(--warn)}
.banner.crit{background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.banner.crit svg{color:var(--crit)}
.banner.good{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.banner.good svg{color:var(--good)}
.banner b{font-weight:600}
.guard-list{margin:5px 0 0;padding-left:17px}
.guard-list li{margin:2px 0}

/* split layout */
.split{display:grid;grid-template-columns:264px 1fr;gap:16px;align-items:start}
.list{display:grid;gap:2px;padding:6px}
.list-item{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;text-align:left;border:0;background:none;padding:8px 9px;border-radius:7px;font-size:12.5px;width:100%}
.list-item:hover{background:var(--surface-2)}
.list-item.active{background:var(--primary-bg)}
.list-item .lt{font-weight:600;line-height:1.25;min-width:0}
.list-item .ls{font-size:11px;color:var(--ink-3);font-weight:400}
.sticky{position:sticky;top:66px}

/* engagement cards */
.eng{display:grid;grid-template-columns:1fr auto;gap:14px;padding:14px 16px;align-items:center}
.eng h3{font-size:15px}
.eng .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;color:var(--ink-2);font-size:12px}
.eng .meta b{color:var(--ink);font-weight:600}
.pipe{display:flex;gap:3px;margin-top:10px;max-width:520px}
.pipe i{height:5px;flex:1;border-radius:3px;background:var(--surface-3)}
.pipe i.done{background:var(--primary)} .pipe i.active{background:var(--warn)}

/* stage overview */
.stage{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:10px 12px;border:0;background:none;border-radius:8px;text-align:left;width:100%}
.stage:hover{background:var(--surface-2)}
.stage .node{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px}
.stage .node svg{width:15px;height:15px}
.stage .sn{font-weight:600;font-size:13.5px}
.stage .sr{font-size:12px;color:var(--ink-2);margin-top:1px}

/* dropzone */
.dropzone{border:2px dashed var(--border-strong);border-radius:var(--radius);background:var(--surface-2);padding:20px;text-align:center}
.dropzone.hot{border-color:var(--primary);background:var(--primary-bg)}
.dropzone h4{font-size:14px}
.dropzone p{font-size:12.5px;color:var(--ink-2);margin:4px 0 12px}

/* risk */
.score{display:inline-grid;place-items:center;min-width:34px;height:24px;padding:0 7px;border-radius:6px;font-weight:700;font-family:var(--mono);font-size:12px;color:#fff}
.t-1{background:#1a7f44}.t-2{background:#5f8a17}.t-3{background:#b06a10}.t-4{background:#b3261e}.t-5{background:#7d1612}
.heat{display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px;font-size:11px;max-width:420px}
.heat .hc{aspect-ratio:1.6;border-radius:5px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px}
.heat .ax{display:grid;place-items:center;color:var(--ink-3);font-weight:600;padding:0 4px}
.risk-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.risk-head{padding:12px 14px;display:grid;gap:10px}
.ctl{border-top:1px solid var(--border);padding:12px 14px;background:var(--surface-2);display:grid;gap:10px}
.ctl:last-child{border-radius:0 0 var(--radius) var(--radius)}
.attr-row{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center}
.proposal{border:1px dashed var(--border-strong);border-radius:8px;padding:10px 12px;background:var(--surface);display:grid;gap:6px}

/* testing grid */
.tri{width:30px;height:26px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);font-weight:700;font-size:13px;display:inline-grid;place-items:center;line-height:1}
.tri.p{background:var(--good-bg);color:var(--good);border-color:transparent}
.tri.f{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.tri.n{background:var(--surface-3);color:var(--ink-3);border-color:transparent;font-size:10px}
.concl{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-2)}
.concl .big{font-size:14.5px;font-weight:700}
.concl.eff{background:var(--good-bg);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.concl.ineff{background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.factor{display:grid;grid-template-columns:24px 1fr;gap:9px;align-items:start}
.factor .fn{width:24px;height:24px;border-radius:6px;background:var(--primary-bg);color:var(--primary-ink);display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:18px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 14px;font-size:12.5px;margin:0}
.kv dt{color:var(--ink-3);font-weight:600}.kv dd{margin:0}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;color:var(--ink-2);padding:8px 12px;font-size:13px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--primary-ink);border-bottom-color:var(--primary)}

/* report */
.report{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.report .cover{padding:26px 30px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.report .cover .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--primary-ink);font-weight:700}
.report .cover h2{font-size:20px;margin:6px 0 4px}
.report .body{padding:22px 30px;display:grid;gap:20px}
.report h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:8px}
.report .dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px}
.report .dash div{border:1px solid var(--border);border-radius:8px;padding:9px 11px;text-align:center}
.report .dash b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.report .dash div:first-child b{font-size:14px;line-height:1.3;padding:3px 0;overflow-wrap:anywhere}
.report .dash span{font-size:10.5px;color:var(--ink-3)}
.obs{border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:10px}
.obs .oh{display:flex;gap:9px;align-items:center;padding:9px 13px;background:var(--surface-2);flex-wrap:wrap}
.obs .oh h4{font-size:13.5px}
.obs dl{margin:0;padding:11px 14px;display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:12.5px}
.obs dt{color:var(--ink-3);font-weight:600}.obs dd{margin:0;white-space:pre-wrap}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,100%);max-height:88vh;overflow:auto}
.modal .mh{padding:15px 18px 0;font-size:15px;font-weight:600}
.modal .mb{padding:12px 18px;display:grid;gap:12px;font-size:13px}
.modal .mf{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:9px;font-size:12.5px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:340px}
.empty{padding:34px 20px;text-align:center;color:var(--ink-2)}
.empty h3{font-size:15px;color:var(--ink);margin-bottom:5px}
.bar{height:7px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:5px}

/* document library */

    rule('Every in-scope sub-process is understood and confirmed', 'understanding', !!eng.cp1, Engine.guards.understanding(eng));
    rule('Process steps name a role and an evidence trail', 'understanding', eng.steps.length > 0, eng.steps.filter(s => !s.actor.trim() || !s.evidence.trim()).map(s => `${KB.sub(s.sub).name} step ${s.n}`));
    const traced = eng.steps.filter(s => (eng.subs[s.sub] || {}).confirmedBy);
    rule('Confirmed process steps were traced in a walkthrough', 'understanding', traced.length > 0, traced.filter(s => !s.walked).map(s => `${KB.sub(s.sub).name} step ${s.n}`));
    rule('Every risk has a distinct root cause, an impact and an owner', 'risks', eng.risks.length > 0, eng.risks.filter(r => !r.cause || !String(r.impact).trim() || !String(r.owner).trim() || Engine.norm(r.cause) === Engine.norm(r.desc)).map(r => r.id));
    rule('Every risk is rated', 'risks', eng.risks.length > 0, eng.risks.filter(r => !r.L || !r.I).map(r => r.id));
    const live = eng.controls.filter(c => !c.absent);
    rule('Every control has an owner, a frequency and test attributes', 'risks', cfg.controls && live.length > 0, live.filter(c => !c.owner.trim() || !c.freq || !c.attrs.filter(a => a.trim()).length).map(c => c.id));
    const concluded = live.filter(c => (eng.dtests[c.id] || {}).conclusion);
    rule('Design conclusions rest on a dated walkthrough', 'testing', concluded.length > 0, concluded.filter(c => { const d = eng.dtests[c.id]; return !String(d.walkthrough || '').trim() || !d.date; }).map(c => c.id));
    const seen = {}; concluded.forEach(c => (eng.dtests[c.id].factors || []).forEach(f => { const k = Engine.norm(f); if (k.length > 12) (seen[k] = seen[k] || new Set()).add(c.id); }));
    const boiler = new Set(); Object.values(seen).forEach(s => { if (s.size >= 3) s.forEach(id => boiler.add(id)); });
    rule('Design factors are specific, not the same sentences on every control', 'testing', concluded.length >= 3, [...boiler]);
    const tested = live.filter(c => ((eng.etests[c.id] || {}).items || []).length);
    rule('Every effectiveness test states its population and completeness basis', 'testing', tested.length > 0, tested.filter(c => { const t = eng.etests[c.id]; return !t.popCount || !t.completeness || (t.completeness === 'reconciled' && !String(t.completenessBasis || '').trim()); }).map(c => c.id));
    const wps = []; concluded.forEach(c => wps.push([c.id + ' design', eng.dtests[c.id]])); tested.forEach(c => wps.push([c.id + ' effectiveness', eng.etests[c.id]]));
    rule('Working papers are reviewed by someone other than the preparer', 'testing', wps.length > 0, wps.filter(w => !w[1].reviewer || w[1].reviewer === w[1].preparer).map(w => w[0]));
    rule('Gaps carry root cause, rating, owner and date', 'gaps', eng.gaps.length > 0, eng.gaps.filter(g => Engine.gapMissing(g).length).map(g => g.id));
    const today = Engine.today(), badDates = [];
    concluded.forEach(c => { const d = eng.dtests[c.id]; if (d.date && (d.date > today || (eng.cp1 && d.date < eng.cp1.at.slice(0, 10)))) badDates.push(`${c.id}: walkthrough dated ${d.date}`); });
    eng.gaps.forEach(g => { if (g.due && g.createdAt && g.due < g.createdAt.slice(0, 10)) badDates.push(`${g.id}: target date precedes the finding`); });
    rule('Dates are possible', 'overview', concluded.length + eng.gaps.length > 0, badDates);
    const pass = out.filter(x => x.ok).length;

  },

  proposeOverall(eng, meth) {

    const o = meth.overall;
    if (high >= 2) return { v: o[2], why: `${high} high-rated gaps` };
    if (high === 1 || mod >= 2) return { v: o[1], why: high ? '1 high-rated gap' : `${mod} moderate gaps` };
    return { v: o[0], why: eng.gaps.length ? 'no high-rated gaps' : 'no gaps raised' };
  },
};

/* State, persistence and the operations that change an engagement. Every operation writes the audit trail. */
const STORE_KEY = 'throughline.v1';
let S = null;

const Store = {
  fresh() {
    return { v: 1, users: [{ id: 'u1', name: 'A. Rahman', role: 'Engagement lead' }, { id: 'u2', name: 'S. Haddad', role: 'Senior auditor' }], userId: 'u1',
      meth: JSON.parse(JSON.stringify(DEFAULT_METH)), engs: [], ui: { view: 'home', engId: '', stage: 'overview' } };
  },
  load() {

    S = Store.fresh(); return true;
  },
  save() {
    const ui = { view: S.ui.view, engId: S.ui.engId, stage: S.ui.stage, sub: S.ui.sub, ctl: S.ui.ctl, agentHidden: S.ui.agentHidden };
    const snap = Object.assign({}, S, { ui });
    try { localStorage.setItem(STORE_KEY, JSON.stringify(snap)); Store.memOnly = false; }
    catch (e) {
      try { const slim = JSON.parse(JSON.stringify(snap)); slim.engs.forEach(en => en.docs.forEach(d => { if (d.rows && d.rows.length > 400) { d.rowsDropped = d.rows.length; d.rows = d.rows.slice(0, 400); } if (d.text && d.text.length > 3000) d.text = d.text.slice(0, 3000); })); localStorage.setItem(STORE_KEY, JSON.stringify(slim)); } catch (e2) {}
      Store.memOnly = true;
    }
  },
  /* Bring an engagement saved by an earlier build up to the current shape. */
  norm(eng) {
    eng.irl = eng.irl || { v: eng.requests.length ? 1 : 0, log: [], suppressed: [] };
    eng.chat = eng.chat || []; eng.undo = eng.undo || [];
    eng.docs.forEach(d => { if (!d.alloc) d.alloc = d.requestId ? 'approved' : 'pending'; });
    eng.requests.forEach(q => { if (!q.origin) q.origin = q.derived ? 'scope' : 'manual'; if (!q.key) q.key = (q.derived ? 'lib:' : 'man:') + q.item; if (q.issue == null) q.issue = ''; });
    eng.steps.forEach(x => { if (!x.type) x.type = 'task'; ['yes', 'no', 'next'].forEach(k => { if (x[k] == null) x[k] = ''; }); });
    return eng;
  },
  reset() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} S = Store.fresh(); },
};
const me = () => S.users.find(u => u.id === S.userId) || S.users[0];
const E = () => S.engs.find(e => e.id === S.ui.engId);
const subName = id => (KB.sub(id) || { name: id }).name;

const Ops = {
  id(eng, p) { eng.seq[p] = (eng.seq[p] || 0) + 1; return p + '-' + String(eng.seq[p]).padStart(2, '0'); },
  log(eng, a, d) { eng.trail.push({ t: new Date().toISOString(), u: me().name, a, d: d || '' }); },

  newEngagement() {
    const eng = { id: 'E-' + Date.now().toString(36).toUpperCase().slice(-5), sample: false, createdAt: new Date().toISOString(), seq: {},
      scope: { client: '', name: '', type: 'full', objective: '', periodFrom: '', periodTo: '', entities: '', framework: 'coso2013', standard: 'gias2024', reader: '', processes: [], exclusions: [], noExclusions: false },
      cp1: null, cp2: null, itgc: { status: 'pending', note: '' }, requests: [], docs: [], subs: {}, steps: [], risks: [], dismissed: [], controls: [],
      irl: { v: 0, log: [], suppressed: [] }, chat: [], undo: [],

  },

  /* ----- scope (Checkpoint 1) ----- */
  confirmScope(eng) {
    if (Engine.guards.cp1(eng).length) return false;
    eng.cp1 = { by: me().name, at: new Date().toISOString() };
    Ops.syncIRL(eng, true);
    eng.scope.processes.forEach(id => { eng.subs[id] = eng.subs[id] || { noProcedure: false, confirmedBy: '', confirmedAt: '', walkthrough: '' }; });
    const itIn = eng.scope.processes.some(id => KB.sub(id).process === 'itgc');
    if (itIn && !eng.topical.length) eng.topical = KB.topical.cyber.items.map(i => ({ id: i.id, status: '', note: '' }));
    if (!itIn) eng.topical = [];

    return true;
  },
  reopenScope(eng, reason) { eng.cp1 = null; Ops.log(eng, 'Scope reopened', reason); },
  /* The request list is a living document: re-derived from the scope, the recorded process, the controls and what
     has arrived. Runs after every change; returns the list of changes it made and versions the list when there are any. */
  syncIRL(eng, quiet) {
    if (!eng.cp1) return [];
    const irl = eng.irl, sig = q => `${q.status}|${(q.missing || []).join(',')}|${q.issue || ''}`, seen = irl.seen || (irl.seen = {}), changes = [];
    const due = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10), sup = new Set(irl.suppressed), live = new Set();
    const add = (key, o) => { live.add(key); if (sup.has(key) || eng.requests.some(q => q.key === key)) return;
      const q = Object.assign({ id: Ops.id(eng, 'Q'), key, item: '', form: '', fields: [], feeds: 'Testing', sub: '', owner: '', due, status: 'pending', naReason: '', missing: [], issue: '', derived: true, origin: 'scope', why: '' }, o);
      eng.requests.push(q); changes.push(`Added — ${q.item}`); };
    eng.scope.processes.forEach(sid => KB.sub(sid).requests.forEach(r => add('lib:' + r.item, { item: r.item, form: r.form, fields: r.fields.slice(), feeds: r.feeds, sub: sid, origin: 'scope', why: `Needed for ${KB.sub(sid).name}` })));
    const words = t => Engine.norm(t).split('_').filter(w => w.length > 3);
    const similar = (x, y) => { const A = words(x), B = words(y); return A.length > 0 && A.filter(w => B.some(v => v === w || v.startsWith(w.slice(0, 5)))).length / A.length >= 0.6; };
    eng.steps.forEach(st => { const ev = String(st.evidence || '').trim(); if (!ev || !eng.scope.processes.includes(st.sub)) return;
      const key = 'ev:' + st.sub + ':' + Engine.norm(ev);
      if (eng.requests.some(q => q.key !== key && similar(ev, q.item))) { live.add(key); return; }       // already asked for under another name
      add(key, { item: `${ev} — for the transaction followed in the walkthrough`, form: 'Copy of the document for that one transaction', feeds: `Walkthrough — ${KB.sub(st.sub).name}`, sub: st.sub, origin: 'process', why: `Named as the evidence at step ${st.n} of ${KB.sub(st.sub).name}` }); });
    eng.controls.filter(c => !c.absent && c.key && !c.fromLib).forEach(c => { const r = eng.risks.find(x => x.id === c.riskId) || {};
      add('ctl:' + c.id, { item: `Evidence that ${c.id} operated, for the items sampled`, form: (c.attrs.filter(x => x.trim())[0] || c.desc.slice(0, 90) || 'Documents showing the control was performed'), feeds: `Effectiveness — ${c.id}`, sub: r.sub || '', origin: 'control', why: `${c.id} is a key control with no standing request` }); });
    eng.requests = eng.requests.filter(q => {
      const gone = (/^(ev|ctl):/.test(q.key) && !live.has(q.key)) || (q.origin === 'scope' && q.sub && !eng.scope.processes.includes(q.sub));
      const drop = gone && !q.override && q.status !== 'na' && !eng.docs.some(d => d.requestId === q.id);
      if (drop) changes.push(`Removed — ${q.item} (what it was for no longer exists)`); return !drop; });
    const label = { pending: 'pending', received: 'received', incomplete: 'incomplete', na: 'not applicable' };
    Object.keys(seen).forEach(id => { if (!eng.requests.some(q => q.id === id)) delete seen[id]; });
    // compared with the state last recorded, so a status that moved when a document arrived is reported here
    eng.requests.forEach(q => { Ops.refreshRequest(eng, q); const was = seen[q.id], now = sig(q); seen[q.id] = now;
      if (was !== undefined && was !== now) changes.push(`${q.item} — now ${label[q.status]}${q.issue ? ': ' + q.issue : q.missing.length ? ': missing ' + q.missing.join(', ') : ''}`); });
    if (changes.length) { irl.v++; irl.log.push({ t: new Date().toISOString(), v: irl.v, changes: changes.slice(0, 14), more: Math.max(0, changes.length - 14) }); if (irl.log.length > 40) irl.log.shift();
      if (!quiet) Ops.log(eng, 'Request list updated', `v${irl.v} — ${changes.slice(0, 3).join('; ')}${changes.length > 3 ? ` (+${changes.length - 3} more)` : ''}`); }
    return changes;
  },

  /* ----- documents ----- */
  async ingest(eng, name, size, mime, text, buf, extra) {
    const doc = { id: Ops.id(eng, 'D'), name, size, mime: mime || '', uploadedAt: new Date().toISOString(), by: me().name, headers: [], rows: null, strength: '', requestId: '', tieConf: 0 };
    if (text != null) { const p = Engine.parseCSV(text); if (p.headers.length > 1 && p.rows.length) { doc.headers = p.headers; doc.rows = p.rows; } }
    if (extra) { if (extra.text && !doc.rows) doc.text = extra.text.slice(0, 15000); ['pages', 'sheets', 'sheet', 'note'].forEach(k => { if (extra[k]) doc[k] = extra[k]; }); }
    Object.assign(doc, Engine.classify(name, doc.headers, doc.text));
    doc.hash = buf ? await Engine.hash(buf) : '';
    const sug = Engine.suggestRequest(doc, eng.requests.filter(q => q.status !== 'na'));
    doc.tieConf = sug.conf;
    eng.docs.push(doc);
    Ops.log(eng, 'Document received', `${name} · classified as ${doc.docType} (${Math.round(doc.conf * 100)}%)`);
    doc.alloc = ['Engagement letter / scope', 'Meeting notes / minutes'].includes(doc.docType) ? 'reference' : 'pending';   // the engagement's own papers answer no client request
    if (sug.id && sug.conf >= 0.5) Ops.tie(eng, doc, sug.id, true);

  },
  tie(eng, doc, requestId, auto) {

    doc.alloc = requestId ? (auto ? 'auto' : 'approved') : 'pending';
    [prev, requestId].filter(Boolean).forEach(id => Ops.refreshRequest(eng, eng.requests.find(q => q.id === id)));
    if (requestId) Ops.log(eng, auto ? 'Document tied automatically' : 'Document tied', `${doc.name} → ${(eng.requests.find(q => q.id === requestId) || {}).item}`);
  },
  refreshRequest(eng, q) {
    if (!q || (q.status === 'na' && !q.override)) return;
    const docs = eng.docs.filter(d => d.requestId === q.id), tab = docs.filter(d => d.rows);
    let st = 'pending', missing = [], issue = '';
    if (docs.length) {
      if (q.fields.length && tab.length) { missing = tab.map(d => Engine.missingFields(q.fields, d.headers)).sort((x, y) => x.length - y.length)[0]; st = missing.length ? 'incomplete' : 'received'; }
      else if (q.fields.length) { issue = 'Wrong form — a data export is required and a document arrived'; st = 'incomplete'; }

  /* ----- understanding ----- */

  },
  concludeDesign(eng, c, result, reason) {

  },
  resetDesign(eng, c, reason) { const d = Ops.dt(eng, c.id); d.conclusion = ''; d.reviewer = ''; Ops.dropGap(eng, 'design:' + c.id); Ops.log(eng, 'Design conclusion withdrawn', `${c.id}: ${reason}`); },
  selectSample(eng, c) {

    t.items = idx.map(i => ({ ref: ds ? Ops.rowRef(ds, i) : `Item ${i + 1} of ${t.popCount}`, line: i + 1, res: [], note: '', evidence: '', explanation: '', corroborated: false, accepted: false, ext: false }));

  extendSample(eng, c) {
    const t = Ops.et(eng, c.id), plan = Engine.plannedSize(eng, c, S.meth), add = plan.extend || 1;
    const ds = eng.docs.find(d => d.id === t.datasetId && d.rows), total = ds ? ds.rows.length : t.popCount;
    const used = new Set(t.items.map(i => i.line)), pool = Engine.pick(total, total, t.seed + 7).filter(i => !used.has(i + 1)).slice(0, add);
    if (!pool.length) return 0;
    pool.forEach(i => t.items.push({ ref: ds ? Ops.rowRef(ds, i) : `Item ${i + 1} of ${t.popCount}`, line: i + 1, res: [], note: '', evidence: '', explanation: '', corroborated: false, accepted: false, ext: true }));

  },
  setResult(eng, c, i, a, v) {
    const t = Ops.et(eng, c.id), it = t.items[i]; while (it.res.length < c.attrs.length) it.res.push('');

  },
  syncToeGap(eng, c) {
    const t = Ops.et(eng, c.id), st = Engine.toe(t, c.attrs.length), r = eng.risks.find(x => x.id === c.riskId);
    if (st.status !== 'ineffective') { Ops.dropGap(eng, 'toe:' + c.id); return; }
    const failed = new Set(); t.items.forEach(it => (it.res || []).forEach((v, a) => { if (v === 'f') failed.add(a); }));
    const facts = `In ${st.fails} of ${st.n} items tested, the control did not operate as described. Attribute(s) not met: ${[...failed].map(a => `"${c.attrs[a]}"`).join('; ')}.`;
    const g = Ops.ensureGap(eng, 'toe:' + c.id, { controlId: c.id, title: `${c.id} did not operate consistently`, desc: facts, cause: r.cause, criterion: criterionFor(r) });
    g.facts = facts;
  },
  review(eng, kind, cid) {
    const w = kind === 'd' ? Ops.dt(eng, cid) : Ops.et(eng, cid);

  },

  /* ----- gaps ----- */
  ensureGap(eng, key, init) {
    let g = eng.gaps.find(x => x.key === key);
    if (g) return g;

  dropGap(eng, key) {

  /* ----- report ----- */
  issue(eng) { if (Engine.guards.issue(eng).length) return false; eng.report.issuedAt = new Date().toISOString(); eng.report.issuedBy = me().name; eng.gaps.forEach(g => { eng.followup[g.id] = eng.followup[g.id] || { status: 'open', evidence: '', note: '', revisedDue: '' }; }); Ops.log(eng, 'Report issued', `Overall rating: ${eng.report.overall} · ${eng.gaps.length} findings`); return true; },

const LIBS = {

    if (/\.(txt|md|log|json|xml)$/.test(n) || /^text\//.test(file.type)) { const t = await file.text(); return { csv: t, text: t }; }
    if (/\.(xlsx|xlsm|xls)$/.test(n)) {
      const X = await loadLib('xlsx'), wb = X.read(await file.arrayBuffer(), { type: 'array' });

      wb.SheetNames.forEach(s => { const c = X.utils.sheet_to_csv(wb.Sheets[s], { blankrows: false }); if (c.length > best.csv.length) best = { csv: c, name: s }; });
      return { csv: best.csv, sheets: wb.SheetNames, sheet: best.name };
    }
    if (/\.pdf$/.test(n)) {

        const tc = await (await pdf.getPage(p)).getTextContent(); let last = null;
        tc.items.forEach(it => { const y = Math.round(it.transform[5]); text += last === null ? '' : Math.abs(y - last) > 2 ? '\n' : ' '; text += it.str; last = y; });
        text += '\n\n';

    }

    }
    if (/\.(png|jpe?g|gif|webp|heic)$/.test(n)) return { note: 'Image — contents are not read automatically' };
    return { note: 'Format not read — filed by name only' };
  } catch (e) { return { note: /blocked|timeout|not loaded/.test(String(e.message)) ? 'The reader for this format could not be loaded — filed by name only' : 'The file could not be read — filed by name only' }; }
}

    const pc = cols.find(c => /^(month|period|year_month)$/.test(c.h)) || cols.find(c => /date|month|period/.test(c.h) && c.non.some(v => /^\d{4}-\d{2}/.test(v)));
    if (pc) { const iso = pc.non.filter(v => /^\d{4}-\d{2}/.test(v)).sort(); if (iso.length) { const per = new Set(iso.map(v => v.slice(0, 7))).size; pts.push(/^(month|period|year_month)$/.test(pc.h) ? `Covers ${iso[0]} to ${iso[iso.length - 1]} · ${per} month${per === 1 ? '' : 's'}` : `${name(pc)} runs from ${iso[0]} to ${iso[iso.length - 1]}`); } }
    const kc = cols.find(c => /(^|_)(code|id|no|number|user)$/.test(c.h) && c.non.length);
    if (kc) pts.push(`${fmtNum(kc.distinct)} distinct ${name(kc)}${kc.distinct < kc.non.length ? ` across ${fmtNum(rows.length)} rows` : ' — one row each'}`);
    const pri = ['net', 'amount', 'total', 'gross', 'value', 'cost', 'salary', 'proceeds', 'deduct', 'limit', 'qty'];
    cols.filter(c => c.numeric && c !== kc && pri.some(p => c.h.includes(p))).sort((a, b) => pri.findIndex(p => a.h.includes(p)) - pri.findIndex(p => b.h.includes(p))).slice(0, 2).forEach(c => {
      const ns = c.non.map(Engine.num), sum = Math.round(ns.reduce((a, b) => a + b, 0) * 100) / 100;
      pts.push(`${name(c)}: total ${fmtNum(sum)} · range ${fmtNum(Math.min(...ns))} to ${fmtNum(Math.max(...ns))}`);
    });
    if (kc) { const keys = [kc.h].concat(pc && pc !== kc && /^(month|period)/.test(pc.h) ? [pc.h] : []); if (keys.length > 1 || kc.distinct >= rows.length * 0.9) { const dup = Engine.duplicates(rows, keys); if (dup.length) pts.push(`${dup.length} repeated ${keys.map(k => k.replace(/_/g, ' ')).join(' + ')} — possible duplicates`); } }
    cols.filter(c => c.blank > 0 && c.non.length > 0).slice(0, 2).forEach(c => pts.push(`${name(c)} is blank in ${fmtNum(c.blank)} of ${fmtNum(rows.length)} rows`));
    if (d.sheets && d.sheets.length > 1) pts.push(`Workbook has ${d.sheets.length} sheets — read from “${d.sheet}”`);

  },
  /* Main points of a text document, extracted — nothing is paraphrased. */
  textPoints(d) {

    const dates = uniq(text.match(/\b(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}|\d{4}-\d{2}-\d{2}|\d{1,2}\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?,?\s+\d{4})\b/gi)).slice(0, 5);
    if (dates.length) pts.push(`Dates: ${dates.join(' · ')}`);
    const amts = uniq(text.match(/(?:[$€£]|USD|EUR|EGP|SAR|AED|GBP)\s?\d[\d,]*(?:\.\d+)?|\b\d{1,3}(?:,\d{3})+(?:\.\d+)?\b/g)).slice(0, 4);
    if (amts.length) pts.push(`Amounts: ${amts.join(' · ')}`);

    lines.filter(l => /\b(approved by|signed by|signature|authori[sz]ed by|prepared by|reviewed by)\b/i.test(l)).slice(0, 2).forEach(l => pts.push(`“${l.slice(0, 120)}”`));
    pts.push(`${fmtNum(text.split(/\s+/).filter(Boolean).length)} words${d.pages ? ` · ${d.pages} page${d.pages === 1 ? '' : 's'}` : ''}`);
    return pts;
  },
  points(d) {
    if (d.summary && d.summary.points.length) return { points: d.summary.points, by: 'assistant' };
    let c = Lib.cache.get(d);
    if (!c || c.n !== (d.rows ? d.rows.length : (d.text || '').length)) { const k = Lib.kind(d); c = { n: d.rows ? d.rows.length : (d.text || '').length, points: k === 'table' ? Lib.profile(d) : k === 'text' ? Lib.textPoints(d) : [] }; Lib.cache.set(d, c); }

  tree(eng, mode) {

    if (mode === 'period') { root.kids = by(d => d.period, 'No period detected'); return root; }

    root.kids = KB.processes.map(p => ({ t: 'proc', label: p.name, kids: p.subs.filter(s => eng.scope.processes.includes(s.id)).map(s => ({ t: 'sub', label: s.name, kids: eng.requests.filter(q => q.sub === s.id).map(reqNode) })) })).filter(p => p.kids.length);

    return root;
  },
  count: n => n.t === 'doc' ? 1 : (n.kids || []).reduce((a, k) => a + Lib.count(k), 0),
};

  /* Notes may carry "Sub-process: X" headers; text under a header belongs to that sub-process. */
  sections(eng, text, subs) {

  walk(text) {

  /* Risks from the recorded steps and the library; the control is described from what the steps show, or recorded as absent. */

    commit();
  },
  suggest(eng) { const s = S.ui.stage, out = [], sub = eng.scope.processes.includes(S.ui.sub) ? S.ui.sub : '', pend = eng.docs.filter(d => d.alloc === 'pending').length, L = Agent.letter(eng), N = Agent.notes(eng);
    if (!eng.cp1) { if (L) out.push(['Build the scope from the engagement letter', 'scope']); }
    else { if (pend && eng.requests.length) out.push([`Allocate ${pend} pending document${pend === 1 ? '' : 's'}`, 'allocate']);
      if ((s === 'understanding' || s === 'overview') && N.length) out.push(['Build the walkthrough from the meeting notes', 'walk']);
      if ((s === 'risks' || s === 'understanding' || s === 'plan') && !eng.cp2 && eng.steps.length) out.push([sub && s === 'risks' ? 'Build risks and controls for this sub-process' : 'Build the whole matrix', 'matrix', sub && s === 'risks' ? sub : '']);
      if (s === 'requests' || s === 'library') out.push(['Update the request list', 'requests']);
      if (s === 'outputs' && !eng.report.issuedAt) out.push(['Compose the executive summary', 'summary']); }

};

      ${Agent.busy ? `<div class="ag-msg"><div class="ag-bubble working"><span class="dots"><i></i><i></i><i></i></span>${esc(UI.busy || Agent.busy)}</div></div>` : ''}</div>

}

Act['ag-run'] = d => { const eng = E(), w = d.what, sub = d.sub || '';

Views.requests = eng => {

    return `<tr><td style="min-width:270px"><b style="font-weight:600">${esc(q.item)}</b> ${q.draft ? chip('info', 'Agent draft', false) : ''}<div class="xs muted">${esc(q.form)}</div>${q.fields.length ? `<div class="xs mono faint" style="margin-top:2px">${esc(q.fields.join(' · '))}</div>` : ''}
        <div class="xs faint" style="margin-top:4px">${esc(REQ_ORIGIN[q.origin] || '')}${q.why ? ' — ' + esc(q.why) : ''}</div></td>
      <td class="tight" style="min-width:120px">${inp('requests', q.id, 'owner', q.owner, { cls: 'cell', ph: 'Role' })}</td><td class="tight">${inp('requests', q.id, 'due', q.due, { cls: 'cell', type: 'date' })}</td>
      <td>${chip(...REQ_ST[q.status])}${q.override ? `<div class="xs" style="margin-top:4px;color:var(--info)">Set by ${esc(q.override.by)} — ${esc(q.override.reason)}<br><span class="faint">computed: ${esc((REQ_ST[q.computed] || ['', ''])[1].toLowerCase())}</span></div>` : ''}</td>
      <td class="small" style="min-width:250px">${checks.map(c => `<div style="color:${tone[c.k]};${c.k === 'crit' ? 'font-weight:600' : ''}">${c.k === 'good' ? '✓' : c.k === 'crit' ? '✕' : '•'} ${esc(c.t)}</div>`).join('')}${docs.map(d => `<button class="btn ghost sm mono" style="padding:1px 0;font-weight:500;font-size:11px" data-act="doc-open" data-id="${d.id}">${esc(d.name)}</button>`).join('<br>')}</td>
      <td class="tight" style="white-space:nowrap">${q.override ? btn('Clear override', 'req-clear', { cls: 'ghost sm', data: { id: q.id } }) : q.status === 'na' ? btn('Reinstate', 'req-reinstate', { cls: 'ghost sm', data: { id: q.id } }) : btn('Override', 'req-override', { cls: 'ghost sm', data: { id: q.id } }) + btn('N/A', 'req-na', { cls: 'ghost sm', data: { id: q.id }, title: 'Mark not applicable — requires a reason' })}<button class="icon-btn sm" data-act="req-del" data-id="${q.id}" title="Remove from the list" aria-label="Remove">${IC.x}</button></td></tr>`; }).join('')}
    </tbody></table></div>
    ${Object.keys(blocked).length ? `<div style="margin-top:12px">${banner('warn', `<b>Work blocked by outstanding items</b>${guardList(Object.entries(blocked).slice(0, 8).map(([f, items]) => `${f} — waiting on ${items.length}: ${items.join('; ')}`))}`)}</div>` : ''}`;
  const hist = `<div class="stack">${irl.log.slice().reverse().map(l => `<div class="card pad"><div class="row"><span class="tag">v${l.v}</span><span class="xs faint">${fmtDT(l.t)}</span></div><ul class="pts" style="margin-top:6px">${l.changes.map(c => `<li>${esc(c)}</li>`).join('')}${l.more ? `<li class="faint">and ${l.more} more</li>` : ''}</ul></div>`).join('') || '<p class="small muted">No changes yet.</p>'}
    ${irl.suppressed.length ? `<div class="card pad"><b class="small">Removed by the auditor — not asked for again</b>${irl.suppressed.map(k => `<div class="row small" style="margin-top:5px"><span class="muted">${esc(k.replace(/^[a-z]+:/, ''))}</span><span class="sp"></span>${btn('Restore', 'req-restore', { cls: 'ghost sm', data: { k } })}</div>`).join('')}</div>` : ''}</div>`;
  return `<div class="page-head"><div><h1>Information request list</h1><div class="sub">A living list. It is rebuilt from the scope, the recorded process and the controls, and re-checked every time a document arrives.</div></div><div class="acts">${btn('Review with the agent', 'ag-run', { cls: 'sm', icon: IC.bolt, data: { what: 'requests' } })}${btn('Add request', 'add-req', { cls: 'sm', icon: IC.plus })}</div></div>
    <div class="card pad" style="margin-bottom:12px"><div class="row"><span class="tag">Version ${irl.v}</span>${Object.entries(REQ_ST).map(([k, v]) => chip(v[0], `${cnt(k)} ${v[1].toLowerCase()}`)).join('')}<span class="sp"></span><span class="xs faint">${last ? 'Last updated ' + fmtDT(last.t) : ''}</span></div>
      ${last ? `<div class="xs muted" style="margin-top:7px">Latest change: ${esc(last.changes.slice(0, 2).join(' · '))}${last.changes.length + (last.more || 0) > 2 ? ` · and ${last.changes.length + (last.more || 0) - 2} more` : ''}</div>` : ''}
      ${pend || unapp ? `<div class="row small" style="margin-top:9px">${pend ? chip('warn', `${pend} document${pend === 1 ? '' : 's'} pending allocation`) : ''}${unapp ? chip('info', `${unapp} automatic allocation${unapp === 1 ? '' : 's'} to approve`) : ''}${btn('Open the allocation queue', 'goto-alloc', { cls: 'sm' })}</div>` : ''}</div>
    <div class="agentbar" data-then="requests"><span class="ab-ic">${IC.up}</span><div class="ab-t">Drop what the client sent anywhere on this bar. Each file is read, matched to its request and checked against the required form and period.</div><div class="row"><label class="btn sm primary" for="file-inp">${IC.up}Upload documents</label><input type="file" id="file-inp" data-then="requests" multiple hidden>${btn('Load sample files', 'sample-files', { cls: 'ghost sm' })}</div></div>
    ${tabs('req', [['list', `List (${eng.requests.length})`], ['history', `History (${irl.log.length})`]], 'list')}${t === 'history' ? hist : list}`;
};
Act['goto-alloc'] = () => { UI.tab.lib = 'alloc'; go('eng', 'library'); };
Act['req-override'] = d => ask({ title: 'Override the status', text: 'The platform works the status out from what arrived. Your override stands until you clear it, and the reason is recorded.', fields: [{ id: 's', label: 'Status', type: 'select', options: [['received', 'Received — accept as it is'], ['incomplete', 'Not usable'], ['pending', 'Pending']] }, { id: 'r', label: 'Reason', type: 'textarea' }], ok: 'Override' },
  v => { const eng = E(), q = eng.requests.find(x => x.id === d.id); q.override = { status: v.s, reason: v.r, by: me().name, at: new Date().toISOString() }; Ops.refreshRequest(eng, q); Ops.log(eng, 'Request status overridden', `${q.item}: ${v.s} — ${v.r}`); });
Act['req-clear'] = d => { const eng = E(), q = eng.requests.find(x => x.id === d.id); q.override = null; Ops.refreshRequest(eng, q); Ops.log(eng, 'Request override cleared', q.item); commit(); };
Act['req-restore'] = d => { const eng = E(); eng.irl.suppressed = eng.irl.suppressed.filter(k => k !== d.k); Ops.log(eng, 'Request restored to the list', d.k.replace(/^[a-z]+:/, '')); commit(); };
Act['req-na'] = d => ask({ title: 'Mark as not applicable', text: 'Not applicable means the item does not exist for this entity. An item that was requested and has not arrived stays Pending.', fields: [{ id: 'r', label: 'Why does this item not exist here?', type: 'textarea' }], ok: 'Mark not applicable' },
  v => { const eng = E(), q = eng.requests.find(x => x.id === d.id); q.status = 'na'; q.naReason = v.r; eng.docs.forEach(x => { if (x.requestId === q.id) x.requestId = ''; }); Ops.log(eng, 'Request marked not applicable', `${q.item}: ${v.r}`); });
Act['req-reinstate'] = d => { const eng = E(), q = eng.requests.find(x => x.id === d.id); q.status = 'pending'; q.naReason = ''; Ops.refreshRequest(eng, q); Ops.log(eng, 'Request reinstated', q.item); commit(); };
Act['req-del'] = d => ask({ title: 'Remove this request?', text: 'It is taken off the list and will not be asked for again. You can restore it from the history.', fields: [{ id: 'r', label: 'Reason', type: 'textarea' }], ok: 'Remove', danger: true }, v => { const eng = E(), q = eng.requests.find(x => x.id === d.id); eng.docs.forEach(x => { if (x.requestId === q.id) { x.requestId = ''; x.alloc = 'pending'; } }); if (q.key && !eng.irl.suppressed.includes(q.key)) eng.irl.suppressed.push(q.key); eng.requests = eng.requests.filter(x => x !== q); Ops.log(eng, 'Request removed by the auditor', `${q.item}: ${v.r}`); });
Act['add-req'] = () => ask({ title: 'Add a request', fields: [{ id: 'item', label: 'Item' }, { id: 'form', label: 'Required form', ph: 'e.g. System export, full period' }, { id: 'fields', label: 'Required fields', required: false, hint: 'comma-separated; checked against CSV headers', ph: 'invoice_no, date, amount' }, { id: 'feeds', label: 'Feeds which work', required: false }], ok: 'Add request' },
  v => { const eng = E(); eng.requests.push({ id: Ops.id(eng, 'Q'), key: 'man:' + v.item, origin: 'manual', why: '', issue: '', item: v.item, form: v.form, fields: v.fields ? v.fields.split(',').map(x => x.trim()).filter(Boolean) : [], feeds: v.feeds || 'Testing', sub: '', owner: '', due: new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10), status: 'pending', naReason: '', missing: [], derived: false }); Ops.log(eng, 'Request added', v.item); });
Act['tie-doc'] = (d, el) => { const eng = E(); Ops.tie(eng, eng.docs.find(x => x.id === d.id), el.value); };
Act['doc-del'] = d => { Ops.removeDoc(E(), d.id); commit(); };
Act['sample-files'] = async () => { const eng = E(), had = new Set(eng.docs.map(d => d.id)); UI.busy = 'Loading sample files…'; render(); await Seed.loadFiles(eng); UI.busy = ''; await Agent.files(eng, eng.docs.filter(d => !had.has(d.id)), ''); };
Act.preview = d => { const doc = E().docs.find(x => x.id === d.id); ask({ title: doc.name, ok: false, html: `<div class="tbl-wrap"><table><thead><tr>${doc.headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${doc.rows.slice(0, 12).map(r => `<tr>${doc.headers.map(h => `<td class="mono xs">${esc(r[h])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="xs muted">First ${Math.min(12, doc.rows.length)} of ${fmtNum(doc.rows.length)} rows.</p>` }); };

/* ---------- process understanding ---------- */
const subList = (eng, cur, stage, meta) => `<div class="card sticky"><div class="list">${eng.scope.processes.map(id => { const m = meta(id); return `<button class="list-item ${cur === id ? 'active' : ''}" data-act="stage" data-stage="${stage}" data-sub="${id}"><span class="sdot sd-${m[0]}">${m[0] === 'done' ? IC.check : ''}</span><span class="lt">${esc(subName(id))}<div class="ls">${esc(m[1])}</div></span></button>`; }).join('')}</div></div>`;
const curSub = eng => (eng.scope.processes.includes(S.ui.sub) ? S.ui.sub : (S.ui.sub = eng.scope.processes[0]));
Views.understanding = eng => {
  const sub = curSub(eng), m = eng.subs[sub] || (eng.subs[sub] = { noProcedure: false, confirmedBy: '', confirmedAt: '', walkthrough: '' });
  const steps = eng.steps.filter(s => s.sub === sub).sort((a, b) => a.n - b.n), c = (id, f, v, ph) => inp('steps', id, f, v, { cls: 'cell', ph });
  const N = Agent.notes(eng), drafts = steps.filter(s => s.draft).length, to = steps.map(s => [s.id, `${s.n}. ${(s.action || s.actor || 'step').slice(0, 26)}`]).concat([['end', 'End of process']]);
  const route = s => s.type === 'decision' ? `<div class="row" style="flex-wrap:nowrap;gap:4px"><span class="xs" style="color:var(--good);font-weight:700">Yes</span>${sel('steps', s.id, 'yes', s.yes, to.filter(x => x[0] !== s.id), { cls: 'cell', ph: 'next step' })}</div><div class="row" style="flex-wrap:nowrap;gap:4px"><span class="xs" style="color:var(--crit);font-weight:700">No&nbsp;</span>${sel('steps', s.id, 'no', s.no, to.filter(x => x[0] !== s.id), { cls: 'cell', ph: 'not recorded' })}</div>` : sel('steps', s.id, 'next', s.next, to.filter(x => x[0] !== s.id), { cls: 'cell', ph: 'next step' });
  return `<div class="page-head"><div><h1>Process understanding</h1><div class="sub">Who does what, who checks it, who approves it and what is kept — recorded by hand, or built by the agent from the meeting notes.</div></div></div>
    <div class="split">${subList(eng, sub, 'understanding', id => { const n = eng.steps.filter(s => s.sub === id).length, ok = n && (eng.subs[id] || {}).confirmedBy; return [ok ? 'done' : n ? 'active' : 'open', n ? `${n} steps${ok ? ' · confirmed' : ' · not confirmed'}` : 'No steps yet']; })}
    <div class="stack"><div class="row"><h2 style="font-size:16px">${esc(subName(sub))}</h2><span class="tag">${esc(KB.sub(sub).processName)}</span><span class="sp"></span>${btn('Add step', 'add-step', { cls: 'sm', icon: IC.plus })}</div>
      <div class="agentbar" data-then="walkthrough"><span class="ab-ic">${IC.bolt}</span><div class="ab-t">${N.length ? `<b>${N.length} set${N.length === 1 ? '' : 's'} of meeting notes</b> in the library: ${esc(N.map(d => d.name).join(', '))}.` : 'No meeting notes in the library yet. Drop them on this bar, upload them, paste them, or describe the process to the agent.'}</div>
        <div class="row">${N.length ? btn('Build this walkthrough', 'ag-run', { cls: 'sm primary', icon: IC.bolt, data: { what: 'walk', sub }, dis: !!Agent.busy }) : ''}<label class="btn sm" for="walk-file">${IC.up}Upload notes</label><input type="file" id="walk-file" data-then="walkthrough" multiple hidden>${btn('Paste notes', 'ag-paste', { cls: 'sm', data: { sub } })}</div></div>
      ${drafts ? banner('info', `<b>${drafts} step${drafts === 1 ? '' : 's'} drafted by the agent.</b> Check them against what the process owner said, edit anything that is wrong, then accept them. <span class="row" style="margin-top:7px">${btn('Accept the drafts', 'accept-drafts', { cls: 'sm primary', data: { sub } })}</span>`) : ''}
      ${steps.length ? `<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Kind</th><th>Performed by (role)</th><th>Action or decision</th><th>System</th><th>Reviewed by</th><th>Approved by</th><th>Evidence retained</th><th>Then</th><th></th></tr></thead><tbody>
      ${steps.map((s, i) => { const fl = Ops.stepFlags(s), bad = fl.some(f => !f.startsWith('No evidence'));
        return `<tr class="${bad ? 'flag' : ''}"><td class="mono">${s.n}</td><td class="tight" style="min-width:104px">${sel('steps', s.id, 'type', s.type, [['task', 'Task'], ['decision', 'Decision'], ['system', 'Automated']], { cls: 'cell' })}</td><td class="tight" style="min-width:150px">${c(s.id, 'actor', s.actor, 'Role')}</td><td class="tight" style="min-width:250px">${c(s.id, 'action', s.action, s.type === 'decision' ? 'The question decided' : 'What they do')}</td><td class="tight" style="min-width:120px">${c(s.id, 'system', s.system, '—')}</td><td class="tight" style="min-width:130px">${c(s.id, 'review', s.review, '—')}</td><td class="tight" style="min-width:130px">${c(s.id, 'approval', s.approval, '—')}</td><td class="tight" style="min-width:150px">${c(s.id, 'evidence', s.evidence, '—')}</td><td class="tight" style="min-width:170px">${route(s)}</td>
        <td class="tight" style="white-space:nowrap"><button class="icon-btn sm" data-act="step-move" data-id="${s.id}" data-dir="-1" ${i ? '' : 'disabled'} aria-label="Move up">${IC.arrowUp}</button> <button class="icon-btn sm" data-act="step-move" data-id="${s.id}" data-dir="1" ${i < steps.length - 1 ? '' : 'disabled'} aria-label="Move down">${IC.arrowDn}</button> <button class="icon-btn sm" data-act="step-del" data-id="${s.id}" aria-label="Delete step">${IC.x}</button></td></tr>
        ${fl.length || s.draft ? `<tr class="${bad ? 'flag' : ''}"><td></td><td colspan="9" class="xs" style="padding-top:0">${draftChip(s)} ${fl.map(f => chip(f.startsWith('No evidence') ? 'warn' : 'crit', f)).join(' ')}</td></tr>` : ''}`; }).join('')}</tbody></table></div>`
      : empty('No steps recorded', 'Build the walkthrough from the meeting notes, or add the steps by hand. Risks can only be identified once the process is recorded.', (N.length ? btn('Build this walkthrough', 'ag-run', { cls: 'primary', icon: IC.bolt, data: { what: 'walk', sub } }) : '') + btn('Add step', 'add-step', { icon: IC.plus }))}
      ${steps.length ? `<div class="card pad stack"><div class="row"><h3 style="font-size:14px">Process flow</h3>${flowStats(eng, sub).map(x => chip(/without/.test(x) ? 'crit' : 'mut', x, false)).join('')}<span class="sp"></span>${chip(steps.every(s => s.walked) ? 'good' : 'warn', `${steps.filter(s => s.walked).length} of ${steps.length} steps seen in the walkthrough`)}</div>
        <div class="row"><span class="xs muted">Drawn from the steps above. Click a step to mark it as seen happening.</span><span class="sp"></span><button class="btn sm ghost" data-act="flow-zoom" data-z="-0.1" aria-label="Zoom out">−</button><span class="xs mono muted">${Math.round(UI.flowZoom * 100)}%</span><button class="btn sm ghost" data-act="flow-zoom" data-z="0.1" aria-label="Zoom in">+</button>${btn('Export', 'flow-export', { cls: 'sm ghost', icon: IC.down, data: { sub } })}</div>
        ${flowSVG(eng, sub, { interactive: true, zoom: UI.flowZoom })}${flowLegend}
        <details class="fold"><summary>Walkthrough trace — what was seen, step by step</summary><div class="tbl-wrap" style="box-shadow:none"><table><thead><tr><th>Step</th><th>Seen in the walkthrough</th><th>Document seen</th></tr></thead><tbody>${steps.map(s => `<tr><td class="small"><span class="mono">${s.n}</span> ${esc(s.action || '—')}</td><td>${chk('steps', s.id, 'walked', s.walked, s.walked ? 'Seen happening' : 'Described only')}</td><td class="tight" style="min-width:220px">${sel('steps', s.id, 'docId', s.docId, eng.docs.map(x => [x.id, x.name]), { cls: 'cell', ph: 'None linked' })}</td></tr>`).join('')}</tbody></table></div></details></div>` : ''}
      <div class="card pad stack">${chk('subs', sub, 'noProcedure', m.noProcedure, 'No documented, approved procedure exists for this sub-process', { change: 'noproc' })}
        ${m.noProcedure ? `<div class="xs muted">Recorded as a gap in its own right (${esc((eng.gaps.find(g => g.key === 'noproc:' + sub) || {}).id || '')}).</div>` : ''}
        ${fld('Walkthrough — one real transaction followed end to end', ta('subs', sub, 'walkthrough', m.walkthrough, { rows: 3, ph: 'Which transaction, which documents were seen, who approved, and the dates in order' }))}
        <div class="form-grid">${fld('Description confirmed by (role)', inp('subs', sub, 'confirmedBy', m.confirmedBy, { ph: 'Process owner role' }))}${fld('Confirmed on', inp('subs', sub, 'confirmedAt', m.confirmedAt, { type: 'date' }))}</div></div>
    </div></div>`;
};
Act['add-step'] = () => { const eng = E(); Ops.addStep(eng, curSub(eng)); Ops.log(eng, 'Process step added', subName(curSub(eng))); commit(); };
Act['step-del'] = d => { const eng = E(), s = eng.steps.find(x => x.id === d.id); eng.steps = eng.steps.filter(x => x !== s); eng.risks.forEach(r => { if (r.stepId === s.id) r.stepId = ''; }); Ops.renumber(eng, s.sub); commit(); };
Act['step-move'] = d => { const eng = E(), s = eng.steps.find(x => x.id === d.id), o = eng.steps.find(x => x.sub === s.sub && x.n === s.n + (+d.dir)); if (o) { const t = s.n; s.n = o.n; o.n = t; } commit(); };
Act.noproc = (d, el) => { const eng = E(), sub = d.id;
  if (el.checked) Ops.ensureGap(eng, 'noproc:' + sub, { title: `No documented procedure — ${subName(sub)}`, desc: `There is no documented and approved policy or procedure for ${lower1(subName(sub))}. The process cannot be operated consistently or held to account against an undocumented standard.`, cause: KB.rootCauses[0], criterion: 'COSO Principle 12 — ' + KB.coso.principles[12] });
  else Ops.dropGap(eng, 'noproc:' + sub); };
/* ---------- knowledge base ---------- */
Views.kb = () => {
  const t = curTab('kb', 'lib');
  let body;
  if (t === 'lib') body = KB.processes.map(p => `<div class="h-sec"><h2>${esc(p.name)}</h2><span class="hint">${p.subs.reduce((n, s) => n + s.risks.length, 0)} library risks</span><span class="line"></span></div><div class="tbl-wrap"><table><thead><tr><th>Ref</th><th>Sub-process</th><th>Risk</th><th>Expected control</th><th>Typical frequency</th><th>Principle</th></tr></thead><tbody>
    ${p.subs.flatMap(s => s.risks.map(r => `<tr><td><span class="tag">${r.id}</span></td><td class="small">${esc(s.name)}</td><td style="min-width:220px"><b style="font-weight:600">${esc(r.title)}</b>${r.fraud ? ' ' + chip('crit', 'Fraud', false) : ''}<div class="xs muted">${esc(r.desc)}</div></td><td class="small" style="min-width:260px">${esc(r.ctl.desc)}<div class="xs faint" style="margin-top:3px">${r.ctl.attrs.length} test attributes · ${esc(r.ctl.nature)} · ${esc(r.ctl.type)}</div></td><td class="small">${esc(freqLabel(r.ctl.freq))}</td><td><span class="tag">P${r.principle}</span></td></tr>`)).join('')}</tbody></table></div>`).join('');
  else if (t === 'coso') body = `<div class="stack">${KB.coso.components.map(c => `<div class="card pad"><h3 style="font-size:14px;margin-bottom:8px">${esc(c.name)}</h3>${c.p.map(n => { const used = S.engs.reduce((k, e) => k + e.controls.filter(x => !x.absent && +x.principle === n).length, 0); return `<div class="row small" style="padding:5px 0;border-top:1px solid var(--border)"><span class="tag">P${n}</span><span>${esc(KB.coso.principles[n])}</span><span class="sp"></span><span class="xs ${used ? 'muted' : 'faint'}">${used} control${used === 1 ? '' : 's'} mapped</span></div>`; }).join('')}</div>`).join('')}</div>`;
  else body = `<div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Component</th><th>Requirement</th></tr></thead><tbody>${KB.topical.cyber.items.map(i => `<tr><td><span class="tag">${i.id}</span></td><td class="small">${esc(i.comp)}</td><td>${esc(i.text)}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:10px">Engaged automatically when IT general controls are in scope. Each item must end as assessed with evidence or excluded with a reason before a report can be issued.</p>`;
  return `<div class="page-head"><div><h1>Knowledge base</h1><div class="sub">The library the platform derives requests, risks, expected controls and test attributes from.</div></div></div>${tabs('kb', [['lib', 'Risk & control library'], ['coso', 'COSO principles'], ['topical', 'Cybersecurity requirement']], 'lib')}${body}`;
};

/* ---------- methodology ---------- */
Views.method = () => {
  const m = S.meth, n = (path, v) => `<input class="inp cell" type="number" min="0" style="width:74px" value="${v}" data-c="meth" data-f="${path}" data-num="1" aria-label="${path}">`;
  return `<div class="page-head"><div><h1>Methodology</h1><div class="sub">Firm settings. Sample sizes, risk bands and ratings across every engagement are computed from these.</div></div><div class="acts">${btn('Restore defaults', 'meth-reset', { cls: 'ghost' })}</div></div>
    <div class="split" style="grid-template-columns:1fr 1fr"><div class="stack"><div class="card pad"><div class="row" style="margin-bottom:10px"><h3 style="font-size:14px">Sample size by control frequency</h3><span class="sp"></span>${fld('Size from', sel('meth', '', 'basis', m.basis, [['typical', 'Typical'], ['min', 'Minimum']]))}</div>
